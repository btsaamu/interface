<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  console.log("[DEBUG] Firebase SDK scripts tag reached, typeof firebase =", typeof firebase);
  var firebaseConfig = {
    apiKey: "AIzaSyAAtag4wPxi0lGyXaqOIyIFoSBvNPMpZZg",
    authDomain: "bts-driver-log.firebaseapp.com",
    databaseURL: "https://bts-driver-log-default-rtdb.firebaseio.com",
    projectId: "bts-driver-log",
    storageBucket: "bts-driver-log.firebasestorage.app",
    messagingSenderId: "203074744997",
    appId: "1:203074744997:web:5e88ea17ed9c005ad1d34c"
  };
  try{
    firebase.initializeApp(firebaseConfig);
    console.log("[DEBUG] firebase.initializeApp succeeded");
  } catch(e){
    console.error("[DEBUG] firebase.initializeApp THREW:", e);
  }
  var __db;
  try{
    __db = firebase.database();
    console.log("[DEBUG] firebase.database() succeeded, databaseURL =", firebaseConfig.databaseURL);
  } catch(e){
    console.error("[DEBUG] firebase.database() THREW:", e);
  }

  function __encodeKey(k){ return encodeURIComponent(k).replace(/\./g, "%2E"); }
  function __decodeKey(k){ return decodeURIComponent(k.replace(/%2E/g, ".")); }

  window.storage = {
    get: function(key, shared){
      console.log("[DEBUG] storage.get called", key, "shared=", shared);
      if(!shared){
        var v = localStorage.getItem("bts_local_"+key);
        if(v === null) return Promise.reject(new Error("not found"));
        return Promise.resolve({key:key, value:v, shared:shared});
      }
      return __db.ref("data/"+__encodeKey(key)).get().then(function(snap){
        console.log("[DEBUG] storage.get SUCCESS for", key, "exists=", snap.exists());
        if(!snap.exists()) throw new Error("not found");
        return {key:key, value:snap.val(), shared:shared};
      }).catch(function(err){
        console.error("[DEBUG] storage.get FAILED for", key, "-", err && err.message, err);
        throw err;
      });
    },
    set: function(key, value, shared){
      console.log("[DEBUG] storage.set called", key, "shared=", shared);
      if(!shared){
        localStorage.setItem("bts_local_"+key, value);
        return Promise.resolve({key:key, value:value, shared:shared});
      }
      return __db.ref("data/"+__encodeKey(key)).set(value).then(function(){
        console.log("[DEBUG] storage.set SUCCESS for", key);
        return {key:key, value:value, shared:shared};
      }).catch(function(err){
        console.error("[DEBUG] storage.set FAILED for", key, "-", err && err.message, err);
        throw err;
      });
    },
    delete: function(key, shared){
      if(!shared){
        localStorage.removeItem("bts_local_"+key);
        return Promise.resolve({key:key, deleted:true, shared:shared});
      }
      return __db.ref("data/"+__encodeKey(key)).remove().then(function(){
        return {key:key, deleted:true, shared:shared};
      }).catch(function(err){
        console.error("[DEBUG] storage.delete FAILED for", key, "-", err && err.message, err);
        throw err;
      });
    },
    list: function(prefix, shared){
      console.log("[DEBUG] storage.list called", prefix, "shared=", shared);
      if(!shared){
        var keys = [];
        for(var i=0;i<localStorage.length;i++){
          var k = localStorage.key(i);
          if(k && k.indexOf("bts_local_")===0){
            var realKey = k.slice("bts_local_".length);
            if(realKey.indexOf(prefix||"")===0) keys.push(realKey);
          }
        }
        return Promise.resolve({keys:keys, prefix:prefix, shared:shared});
      }
      return __db.ref("data").get().then(function(snap){
        console.log("[DEBUG] storage.list SUCCESS, exists=", snap.exists());
        var all = snap.exists() ? snap.val() : {};
        var keys = Object.keys(all).map(__decodeKey).filter(function(k){ return k.indexOf(prefix||"")===0; });
        return {keys:keys, prefix:prefix, shared:shared};
      }).catch(function(err){
        console.error("[DEBUG] storage.list FAILED -", err && err.message, err);
        throw err;
      });
    }
  };
  console.log("[DEBUG] window.storage shim installed");
</script>
</head>
<body>
<style>
  :root{
    --maroon:#7A1F2B; --maroon-dark:#4F1119; --gold:#C9A227; --gold-light:#F4E7C2;
    --cream:#FBF7F0; --ink:#241512; --led-bg:#14100A; --led-amber:#FFB000;
    --alert-red:#D6402F; --warn-orange:#B5652B; --success:#3C7A5B; --muted:#8A7B6E; --line:#E4D9C4;
  }
  *{box-sizing:border-box;}
  #bts-root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);min-height:100%;padding:0;margin:0;}
  .bts-h{font-weight:800;letter-spacing:0.06em;text-transform:uppercase;}
  .headsign{background:var(--led-bg);color:var(--led-amber);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;text-shadow:0 0 6px rgba(255,176,0,0.55);padding:10px 16px;border-radius:6px;overflow:hidden;white-space:nowrap;}
  .headsign.alert{background:#1a0d0a;color:#FF6B4A;text-shadow:0 0 8px rgba(255,90,50,0.6);animation:bts-pulse 1.4s ease-in-out infinite;}
  @keyframes bts-pulse{0%,100%{opacity:1;}50%{opacity:0.55;}}
  .bts-top{background:var(--maroon);color:var(--gold-light);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .bts-top .crest{display:flex;align-items:center;gap:10px;}
  .bts-top .crest-dot{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--maroon-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  .bts-top .title{font-size:15px;letter-spacing:0.08em;}
  .bts-top .sub{font-size:11px;color:var(--gold);opacity:0.85;}
  .bts-switch{background:transparent;border:1px solid var(--gold);color:var(--gold-light);padding:6px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;}
  .bts-switch:hover{background:rgba(201,162,39,0.15);}
  .pending-pill{background:var(--warn-orange);color:white;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.03em;}
  .bts-wrap{max-width:720px;margin:0 auto;padding:16px;}
  .bts-wrap.wide{max-width:1400px;}
  .role-pick{display:flex;flex-direction:column;gap:14px;padding:40px 20px;max-width:420px;margin:0 auto;}
  .role-btn{background:white;border:2px solid var(--line);border-radius:12px;padding:22px;text-align:left;cursor:pointer;transition:border-color .15s, transform .15s;}
  .role-btn:hover{border-color:var(--maroon);transform:translateY(-1px);}
  .role-btn .rb-title{font-weight:800;font-size:17px;color:var(--maroon);text-transform:uppercase;letter-spacing:0.04em;}
  .role-btn .rb-sub{font-size:13px;color:var(--muted);margin-top:4px;}
  .card{background:white;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
  .card-label{font-size:11px;font-weight:800;color:var(--maroon);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
  .field-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .field{flex:1;min-width:120px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;}
  .field input, .field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:var(--cream);color:var(--ink);}
  .field input:focus, .field select:focus{outline:2px solid var(--maroon);outline-offset:1px;}
  .btn{border:none;border-radius:8px;padding:12px 16px;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;width:100%;}
  .btn-primary{background:var(--maroon);color:var(--gold-light);}
  .btn-primary:hover{background:var(--maroon-dark);}
  .btn-primary:disabled{background:var(--muted);cursor:not-allowed;}
  .btn-gold{background:var(--gold);color:var(--maroon-dark);}
  .btn-outline{background:transparent;border:1.5px solid var(--maroon);color:var(--maroon);}
  .btn-small{width:auto;padding:7px 11px;font-size:11.5px;}
  .link-btn{background:none;border:none;color:var(--maroon);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;padding:2px 6px;}
  .link-btn.danger{color:var(--alert-red);}
  .disclosure{background:var(--gold-light);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--maroon-dark);margin-bottom:10px;}
  .mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);}
  .empty-note{color:var(--muted);font-size:13px;padding:10px 0;}
  .tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;text-transform:uppercase;}
  .tag.over{background:var(--alert-red);color:white;}
  .tag.ok{background:var(--success);color:white;}
  .tag.edited{background:var(--gold);color:var(--maroon-dark);}
  .tag.ack{background:var(--success);color:white;}

  .big-route-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .route-cat-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin:10px 0 6px;}
  .route-cat-label:first-child{margin-top:0;}
  .big-route-btn{padding:14px 8px;min-height:88px;display:flex;align-items:center;justify-content:center;line-height:1.25;border:3px solid var(--line);border-radius:14px;background:white;text-align:center;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:0.02em;color:var(--maroon-dark);cursor:pointer;}
  .big-route-btn:active{background:var(--gold-light);border-color:var(--maroon);}
  .big-route-btn.active{background:var(--gold-light);border-color:var(--maroon);color:var(--maroon-dark);}
  .landscape-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .big-block{flex:1;min-width:150px;background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;}
  .big-label{font-size:12px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--maroon);margin-bottom:8px;}
  .big-num{font-size:40px;font-weight:800;font-family:ui-monospace,monospace;line-height:1;min-width:44px;display:inline-block;}
  .big-stepper{display:flex;align-items:center;justify-content:center;gap:10px;}
  .big-stepper button{width:56px;height:56px;font-size:28px;border-radius:12px;border:1px solid var(--line);background:white;font-weight:800;color:var(--maroon);cursor:pointer;}
  .big-stepper.over .big-num{color:var(--alert-red);}
  .big-time-input{width:100%;text-align:center;font-size:24px;font-weight:800;font-family:ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:white;margin-bottom:4px;}
  .big-toggle{width:100%;padding:18px 6px;border-radius:12px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;border:3px solid var(--line);background:white;color:var(--ink);cursor:pointer;}
  .big-toggle.active{background:var(--alert-red);border-color:var(--alert-red);color:white;}
  .big-log-btn{padding:22px;font-size:18px;margin-top:6px;}

  .info-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--line);}
  .edit-form{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 4px;}
  .edit-form input{padding:6px;border:1px solid var(--line);border-radius:6px;font-size:13px;width:60px;}
  .edit-form input.wide{width:90px;}
  .info-row:last-of-type{border-bottom:none;}

  .log-entry{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px;}
  .grid-route-label{font-size:12px;color:var(--muted);margin:10px 0 6px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;}
  .totals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .totals-cell{text-align:center;}
  .totals-num{font-size:20px;font-weight:800;color:var(--ink);font-family:ui-monospace,monospace;}
  .totals-num-alert{color:var(--alert-red);}
  .totals-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}
  .dispatch-today-grid{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start;}
  .dispatch-sidebar{display:flex;flex-direction:column;gap:12px;}
  .dispatch-routes{display:flex;flex-direction:column;}
  .route-row-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin:0 0 6px;}
  .route-row-grid{display:grid;gap:10px;margin-bottom:14px;}
  .route-row-grid-3{grid-template-columns:repeat(3,1fr);}
  .route-row-grid-2{grid-template-columns:repeat(2,1fr);}
  .route-box{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;position:relative;}
  .route-box-overflow{background:#FCEAE6;border-color:var(--alert-red);}
  .route-box-badge{position:absolute;top:10px;right:10px;background:var(--alert-red);color:white;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;}
  .route-box-title{font-size:13px;font-weight:800;color:var(--maroon);}
  .route-box-driver{font-size:13px;font-weight:800;color:var(--ink);}
  .route-box-total{font-size:11px;color:var(--muted);}
  .route-box-total-alert{color:var(--alert-red);font-weight:800;}
  .route-box-feed{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:11px;color:var(--muted);}
  .route-box-overflow .route-box-feed{border-top-color:var(--alert-red);color:#993C1D;}
  .route-box-feed-entry{padding:4px 0;border-bottom:1px dashed var(--line);}
  .route-box-feed-entry:last-of-type{border-bottom:none;}
  .route-box-overflow .route-box-feed-entry{border-bottom-color:var(--alert-red);}
  .route-box-feed-time{font-weight:800;}
  .route-box-empty{color:var(--muted);}
  .route-box-expand{color:var(--maroon);font-weight:800;margin-top:2px;cursor:pointer;}
  @media (max-width: 800px){
    .dispatch-today-grid{grid-template-columns:1fr;}
    .route-row-grid-3{grid-template-columns:repeat(2,1fr);}
  }
  td.total-cell{font-size:16px;font-weight:800;color:var(--maroon);}
  td.total-cell.total-pending{color:var(--muted);font-weight:700;}
  .totals-note{font-size:10.5px;color:var(--muted);margin:4px 0 12px;}
  .grid-route-label:first-child{margin-top:0;}
  table.log-grid{border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-width:100%;margin-bottom:12px;}
  table.log-grid th{background:var(--maroon);color:var(--gold-light);padding:8px 10px;text-align:left;font-size:11px;font-weight:700;white-space:nowrap;}
  table.log-grid td{padding:8px 10px;font-size:12px;color:var(--ink);vertical-align:top;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.log-grid tr:last-child td{border-bottom:none;}
  table.log-grid .grid-time{font-weight:700;}
  table.log-grid .grid-count{font-size:10.5px;color:var(--muted);margin-top:2px;}
  table.log-grid td.overflow-cell{background:#FCEAE6;}
  table.log-grid td.overflow-cell .grid-time{color:var(--alert-red);}
  table.log-grid td.overflow-cell .grid-count{color:var(--alert-red);}
  table.log-grid td.pending-cell{color:var(--muted);}
  table.log-grid td.tripnum-cell{font-weight:800;}
  .log-entry:last-child{border-bottom:none;}
  .log-entry.overflow{background:#FCEAE6;}

  .pt-item{border-bottom:1px solid var(--line);padding:10px 0;}
  .pt-item:last-child{border-bottom:none;}
  .pt-item-label{font-size:13px;font-weight:600;margin-bottom:6px;}
  .pt-btns{display:flex;gap:6px;}
  .pt-btn{flex:1;padding:11px 4px;border:2px solid var(--line);border-radius:8px;background:white;font-weight:800;font-size:12px;text-transform:uppercase;cursor:pointer;}
  .pt-btn.sel-good{background:var(--success);color:white;border-color:var(--success);}
  .pt-btn.sel-bad{background:var(--alert-red);color:white;border-color:var(--alert-red);}
  .pt-btn.sel-na{background:var(--muted);color:white;border-color:var(--muted);}
  .pt-explain{width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
  .pt-item.pt-error{border:2px solid var(--alert-red);border-radius:8px;padding:10px;background:#FCEAE6;}
  .pt-error-field{border:2px solid var(--alert-red) !important;background:#FCEAE6 !important;}
  .fuel-chip-row{display:flex;gap:6px;flex-wrap:wrap;border-radius:8px;padding:2px;}
  .fuel-chip{flex:1;min-width:52px;text-align:center;padding:10px 6px;border:2px solid var(--line);border-radius:8px;background:white;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink);}
  .fuel-chip.active{background:var(--maroon);border-color:var(--maroon);color:var(--gold-light);}

  .exception-item{background:#FBF1E6;border:1px solid var(--warn-orange);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12.5px;color:var(--warn-orange);font-weight:600;}
  .issue-item{background:#FCEAE6;border:1px solid var(--alert-red);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12.5px;color:var(--alert-red);font-weight:600;}
  .alert-item{display:flex;justify-content:space-between;align-items:center;background:#FCEAE6;border:1px solid var(--alert-red);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .alert-item .a-txt{font-weight:700;color:var(--alert-red);}
  .alert-item .a-time{font-size:11px;color:var(--muted);font-weight:600;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px;}
  .stat-box{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .stat-box .num{font-size:26px;font-weight:800;color:var(--maroon);font-family:ui-monospace,monospace;}
  .stat-box .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;}
  table.feed{width:100%;border-collapse:collapse;font-size:11px;}
  table.feed th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 5px;}
  table.feed td{padding:6px 5px;border-bottom:1px solid var(--line);}
  table.feed tr.overflow td{background:#FCEAE6;color:var(--alert-red);font-weight:700;}
  .gps-link{color:var(--maroon);text-decoration:underline;font-size:11px;}
  .top-actions{display:flex;gap:8px;align-items:center;}
  .tab-btn{flex:1;padding:11px 14px;border:2px solid var(--line);border-radius:9px;background:white;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:0.03em;color:var(--maroon);cursor:pointer;}
  .tab-btn.active{background:var(--maroon);border-color:var(--maroon);color:var(--gold-light);}
</style>

<div id="bts-root">
  <div id="bts-topbar" class="bts-top" style="display:none;">
    <div class="crest">
      <div class="crest-dot">B</div>
      <div><div class="title bts-h">Bulldog Transit</div><div class="sub" id="bts-role-label">Driver Log</div></div>
    </div>
    <div class="top-actions">
      <span id="pending-badge"></span>
      <button class="bts-switch" id="bts-switch-role">Switch Role</button>
    </div>
  </div>

  <div id="bts-role-pick" class="role-pick">
    <div style="text-align:center;margin-bottom:6px;">
      <div class="bts-h" style="color:var(--maroon);font-size:20px;">Bulldog Transit System</div>
      <div style="color:var(--muted);font-size:13px;">Off-campus shuttle ridership log</div>
    </div>
    <div class="role-btn" id="pick-driver"><div class="rb-title">I'm a Driver</div><div class="rb-sub">Pre-trip, log stops, post-trip</div></div>
    <div class="role-btn" id="pick-dispatch"><div class="rb-title">I'm Dispatch</div><div class="rb-sub">Live feed, alerts, inspections</div></div>
  </div>

  <div id="bts-driver-view" class="bts-wrap" style="display:none;"></div>
  <div id="bts-dispatch-view" class="bts-wrap wide" style="display:none;"></div>
</div>

<script>
(function(){
  const DEFAULT_CAPACITY = 14;
  const ROUTES = {
    dean:         {label:"Dean", category:"Day", stops:["Dean"], schedule:{startHour:7, endHour:18, legs:[
                      {label:"Depart AAMU",offset:20},{label:"Arrive Dean",offset:30},{label:"Depart Dean",offset:35},{label:"Arrive AAMU",offset:45}]}},
    waterleaf:    {label:"Waterleaf", category:"Day", stops:["Waterleaf"], schedule:{startHour:7, endHour:18, legs:[

  const ROUTE_CATEGORIES = ["Day","Night","Weekend/Holiday"];
  function routeShort(key){ return ROUTES[key].label; }

  function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
  function fmtClock(totalMin){
    let h = Math.floor(totalMin/60) % 24, m = totalMin % 60;
    const ap = h>=12 ? "PM" : "AM";
    let h12 = h % 12; if(h12===0) h12 = 12;
    return h12+":"+String(m).padStart(2,"0")+" "+ap;
  }
  // Which top-of-hour "runs" exist for a route today: either an explicit fixed list
  // (e.g. weekend/holiday: only 8, 11, 2pm, 4pm, 6pm) or every hour in a start/end range.
  function scheduleRunHours(sch){
    if(sch.runHours) return sch.runHours.slice();
    const departMin = sch.legs[0].offset;
    const hours = [];
    for(let hour = sch.startHour; hour <= sch.endHour; hour++){
      if(hour*60 + departMin > sch.endHour*60) break;
      hours.push(hour);
    }
    return hours;
  }
  // Is right now closest to the LAST scheduled run of a fixed-hours (weekend/holiday) route?
  function isFinalScheduledRun(routeKey){
    const sch = ROUTES[routeKey] && ROUTES[routeKey].schedule;
    if(!sch || !sch.runHours) return false;
    const departMin = sch.legs[0].offset;
    const nowMin = nowMinutes();
    let best = null, bestDiff = Infinity;
    scheduleRunHours(sch).forEach(hour=>{
      const diff = Math.abs(hour*60+departMin - nowMin);
      if(diff < bestDiff){ bestDiff = diff; best = hour; }
    });
    return best === sch.runHours[sch.runHours.length-1];
  }
  // Next scheduled AAMU departure for a route, based on its own schedule.
  function nextScheduledRun(routeKey){
    const sch = ROUTES[routeKey] && ROUTES[routeKey].schedule;
    if(!sch) return null;
    const departMin = sch.legs[0].offset;
    const nowMin = nowMinutes();
    for(const hour of scheduleRunHours(sch)){
      const cand = hour*60 + departMin;
      if(cand >= nowMin) return fmtClock(cand);
    }
    return "No more runs today";
  }
  // Nearest scheduled departure to right now, for record-keeping on a newly started trip
  // (may be slightly in the past, unlike nextScheduledRun which only looks forward).
  function nearestRouteSlot(routeKey){
    const sch = ROUTES[routeKey] && ROUTES[routeKey].schedule;
    if(!sch) return null;
    const departMin = sch.legs[0].offset;
    const nowMin = nowMinutes();
    let best = null, bestDiff = Infinity;
    for(const hour of scheduleRunHours(sch)){
      const cand = hour*60 + departMin;
      const diff = Math.abs(cand-nowMin);
      if(diff < bestDiff){ bestDiff = diff; best = cand; }
    }
    return best===null ? null : fmtClock(best);
  }
  // Full timetable for a route: one row per scheduled run, one column per leg.
  function fullScheduleHtml(routeKey){
    const sch = ROUTES[routeKey] && ROUTES[routeKey].schedule;
    if(!sch) return '<div class="empty-note">No schedule available.</div>';
    const rows = scheduleRunHours(sch).map(hour => sch.legs.map(leg => fmtClock(hour*60 + leg.offset)));
    const header = sch.legs.map(leg=>`<th>${leg.label}</th>`).join("");
    const body = rows.map(r=>`<tr>${r.map(t=>`<td>${t}</td>`).join("")}</tr>`).join("");
    return `<table class="feed"><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table>`;
  }

  function todayKey(){

  function fmtGeoShort(lat,lng,gpsError){ if(lat==null||lng==null) return `no GPS${gpsError?` (${gpsError})`:''}`; return `${lat.toFixed(4)}, ${lng.toFixed(4)}`; }

  function getGeo(){
    return new Promise(resolve=>{
      if(!navigator.geolocation){ resolve({lat:null,lng:null,gpsError:"unsupported"}); return; }
      const t = setTimeout(()=>resolve({lat:null,lng:null,gpsError:"timeout"}), 6500);
      navigator.geolocation.getCurrentPosition(
        pos => { clearTimeout(t); resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, gpsError:null}); },
        err => { clearTimeout(t); resolve({lat:null,lng:null,gpsError:err.message||"denied"}); },
        {enableHighAccuracy:true, timeout:6000, maximumAge:15000}
      );
    });
  }

  // ---- storage helpers ----
  async function loadDayForWrite(){
    try{
      const r = await window.storage.get(dayStorageKey(), true);
      return {data: r ? JSON.parse(r.value) : {trips:[]}, ok:true};
    }catch(e){
      // get() throws both when the key genuinely doesn't exist yet (normal on the
      // first write of a new day) and on a real fetch failure — list() lets us
      // tell those apart instead of refusing to ever write on day one.
      try{
        const listRes = await window.storage.list(dayStorageKey(), true);
        const exists = listRes && listRes.keys && listRes.keys.includes(dayStorageKey());
        if(!exists) return {data:{trips:[]}, ok:true};
        return {data:null, ok:false};
      }catch(e2){ return {data:null, ok:false}; }
    }
  }
  async function loadDayReadOnly(){ const res = await loadDayForWrite(); return res.ok ? res.data : (state.lastKnownDay || {trips:[]}); }
  async function loadDayWithRetry(maxAttempts, delayMs){
    maxAttempts = maxAttempts || 4; delayMs = delayMs || 700;
    for(let i=0;i<maxAttempts;i++){
      const res = await loadDayForWrite();
      if(res.ok) return res.data;
      if(i < maxAttempts-1) await new Promise(r=>setTimeout(r, delayMs*(i+1)));
    }
    return state.lastKnownDay || {trips:[]};
  }

  async function getShiftRecord(name){

      return {shifts:[{pretrip:rec.pretrip||null, shiftEnded:rec.shiftEnded||false, posttrip:rec.posttrip||null, ridershipSubmitted:rec.ridershipSubmitted||false}]};
    }catch(e){ return {shifts:[blankShift()]}; }
  }

  // ---- sync / offline queue ----
  function markPending(id){ state.pendingIds.add(id); renderPendingBadge(); }

  function getLocalTrip(id){ if(state.myTrip && state.myTrip.id===id) return state.myTrip; return state.myCompletedTrips.find(t=>t.id===id) || null; }
  async function syncTrip(trip){
    const res = await loadDayForWrite();
    if(!res.ok){ markPending(trip.id); return false; }
    const day = res.data;
    const idx = day.trips.findIndex(x=>x.id===trip.id);
    if(idx===-1) day.trips.push(trip); else day.trips[idx]=trip;
    const saved = await saveDay(day);
    if(saved){ state.lastKnownDay = day; clearPending(trip.id); return true; }
    markPending(trip.id); return false;
  }
  async function flushPending(){

  async function unlockDriver(name){
    state.driverLock = {status:'unlocked', name, vehicle:''};
    const profile = await loadDriverProfile();
    state.driverLock.vehicle = profile.vehicle || "";
    const day = await loadDayWithRetry();
    const mine = day.trips.filter(t=>normalizeName(t.driver)===normalizeName(name) && t.date===todayKey());
    state.myCompletedTrips = mine.filter(t=>t.complete);
    state.myTrip = mine.find(t=>!t.complete) || null;
    if(state.myTrip){
      const t = state.myTrip;
      const routeDef = ROUTES[t.route];
      if(!t.departAAMU) state.stopPhase = 'depart_campus';
      else if(routeDef && t.stops.length >= routeDef.stops.length) state.stopPhase = 'arrive_campus';
      else state.stopPhase = 'arriving';
      state.pendingStop = null; state.divertedName = '';
    }
    state.shiftRecord = await getShiftRecord(name);
    const cs0 = currentShift();
    if(cs0.pretrip){
      state.shiftRoute = cs0.pretrip.route;
      state.shiftVehicle = cs0.pretrip.vehicle;
      state.shiftCapacity = cs0.pretrip.capacity;
      state.selectedRouteChoice = cs0.pretrip.route;
    }
    state.pretripAnswers = {}; state.pretripPhoto = null; state.pretripFuel = null; state.posttripFuel = null; state.postTripAnswers = {};
    await renderDriverHome();
  }

    renderPretripPage();

             </div>
             <div class="pt-item">
               <div class="pt-item-label">Starting Fuel Level</div>
               ${fuelChipsHtml("pt-fuel-chips", state.pretripFuel)}
             </div>
             <div id="pretrip-items"></div>
             <div class="pt-item">
               <div class="pt-item-label">Photo of any damage (optional)</div>
               <input type="file" accept="image/*" capture="environment" id="pt-photo">
               <div id="pt-photo-preview"></div>
             </div>`
        }
      </div>
      <button class="btn btn-primary big-log-btn" id="begin-route-btn">BEGIN ROUTE</button>
    `;
    const vInput = document.getElementById("d-vehicle");
    vInput.onblur = async () => { const cap = await getVehicleCapacity(vInput.value.trim()); if(cap) document.getElementById("d-capacity").value = cap; };
    vInput.oninput = () => { if(vInput.value.trim()) vInput.classList.remove("pt-error-field"); };

    const grid = document.getElementById("route-grid");
    grid.innerHTML = routeGridHtml(state.selectedRouteChoice);
    const nextRunBox = document.getElementById("pretrip-next-run");
    function showNextRun(key){
      if(!key){ nextRunBox.style.display = "none"; return; }
      nextRunBox.style.display = "block";
      nextRunBox.textContent = `Next Scheduled Run for ${routeShort(key)}: ${nextScheduledRun(key)}`;
    }
    showNextRun(state.selectedRouteChoice);
    wireRouteGrid(grid, (key) => {
      state.selectedRouteChoice = key;
      grid.style.outline = "";
      showNextRun(key);
    });

    if(!already){
      const itemsBox = document.getElementById("pretrip-items");
      itemsBox.innerHTML = PRETRIP_ITEMS.map((item,i)=>`
        <div class="pt-item">
          <div class="pt-item-label">${item}</div>
          <div class="pt-btns" data-idx="${i}">
            <button class="pt-btn" data-val="good">Good</button>
            <button class="pt-btn" data-val="bad">Bad</button>
            <button class="pt-btn" data-val="na">N/A</button>
          </div>
          <input type="text" class="pt-explain" id="ptx-explain-${i}" placeholder="Describe the issue" style="display:none;">
        </div>
      `).join("");
      itemsBox.querySelectorAll(".pt-btns").forEach(group=>{
        const idx = group.dataset.idx;
        group.querySelectorAll(".pt-btn").forEach(btn=>{
          btn.onclick = () => {
            group.querySelectorAll(".pt-btn").forEach(b=>b.classList.remove("sel-good","sel-bad","sel-na"));
            btn.classList.add("sel-"+btn.dataset.val);
            state.pretripAnswers[idx] = btn.dataset.val;
            document.getElementById("ptx-explain-"+idx).style.display = btn.dataset.val==='bad' ? 'block' : 'none';
            group.closest(".pt-item").classList.remove("pt-error");
          };
        });
      });
      itemsBox.querySelectorAll(".pt-explain").forEach(inp=>{
        inp.oninput = () => { if(inp.value.trim()) inp.closest(".pt-item").classList.remove("pt-error"); };
      });
      document.getElementById("pt-mileage").oninput = (e) => { if(e.target.value.trim()) e.target.classList.remove("pt-error-field"); };
      wireFuelChips("pt-fuel-chips", f => { state.pretripFuel = f; });
      document.getElementById("pt-photo").onchange = (e) => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          state.pretripPhoto = reader.result;
          document.getElementById("pt-photo-preview").innerHTML = `<img src="${reader.result}" style="max-width:140px;border-radius:8px;margin-top:6px;">`;
        };
        reader.readAsDataURL(file);
      };
    }

    document.getElementById("change-driver-btn").onclick = () => logoutDriver();
    document.getElementById("begin-route-btn").onclick = async () => { await beginRoute(already); };
  }

  async function beginRoute(already){
    document.getElementById("route-grid").style.outline = "";
    document.getElementById("d-vehicle").classList.remove("pt-error-field");
    const vehicle = document.getElementById("d-vehicle").value.trim();
    const capacity = parseInt(document.getElementById("d-capacity").value,10) || DEFAULT_CAPACITY;
    let firstError = null;

    if(!state.selectedRouteChoice){
      const grid = document.getElementById("route-grid");
      grid.style.outline = "2px solid var(--alert-red)"; grid.style.borderRadius = "10px";
      firstError = firstError || grid;
    }
    if(!vehicle){
      const vf = document.getElementById("d-vehicle");
      vf.classList.add("pt-error-field");
      firstError = firstError || vf;
    }

    if(!already){
      const mileageInput = document.getElementById("pt-mileage");
      const mileage = mileageInput.value.trim();
      if(!mileage){ mileageInput.classList.add("pt-error-field"); firstError = firstError || mileageInput; }

      const fuelBox = document.getElementById("pt-fuel-chips");
      if(!state.pretripFuel){ fuelBox.classList.add("pt-error-field"); firstError = firstError || fuelBox; }

      PRETRIP_ITEMS.forEach((_,i)=>{
        const itemEl = document.getElementById("ptx-explain-"+i).closest(".pt-item");
        const answered = !!state.pretripAnswers[i];
        const needsExplain = state.pretripAnswers[i]==='bad' && !document.getElementById("ptx-explain-"+i).value.trim();
        if(!answered || needsExplain){ itemEl.classList.add("pt-error"); firstError = firstError || itemEl; }
        else { itemEl.classList.remove("pt-error"); }
      });

      if(!mileage || !state.pretripFuel || PRETRIP_ITEMS.some((_,i)=> !state.pretripAnswers[i] || (state.pretripAnswers[i]==='bad' && !document.getElementById("ptx-explain-"+i).value.trim()))){
        if(firstError) firstError.scrollIntoView({behavior:"smooth", block:"center"});
        return;
      }
    }
    if(!state.selectedRouteChoice || !vehicle){
      if(firstError) firstError.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }

    if(!already){
      const mileage = document.getElementById("pt-mileage").value.trim();
      const checklist = PRETRIP_ITEMS.map((item,i)=>({item, status:state.pretripAnswers[i], note: state.pretripAnswers[i]==='bad' ? document.getElementById("ptx-explain-"+i).value.trim() : ""}));
      currentShift().pretrip = {done:true, route:state.selectedRouteChoice, vehicle, capacity, startingMileage:mileage, startingFuel:state.pretripFuel, checklist, photo: state.pretripPhoto||null, completedAt:new Date().toISOString()};
      await saveShiftRecord(state.driverLock.name, state.shiftRecord);
    }
    state.shiftRoute = state.selectedRouteChoice; state.shiftVehicle = vehicle; state.shiftCapacity = capacity;
    await setVehicleCapacity(vehicle, capacity);
    await saveDriverProfile({name: state.driverLock.name, vehicle});
    await startTripInternal();
  }

  async function startTripInternal(){
    const tripsToday = [...state.myCompletedTrips, ...(state.myTrip?[state.myTrip]:[])];
    const trip = {
      id:"trip-"+Date.now(), route: state.shiftRoute, driver: state.driverLock.name,
      vehicle: state.shiftVehicle, vehicleCapacity: state.shiftCapacity,
      date: todayKey(), tripNum: tripsToday.length+1, scheduledRun: nearestRouteSlot(state.shiftRoute),
      departAAMU: null, departMeta: null,
      stops:[], arriveAAMU:null, arriveMeta:null, complete:false
    };
    state.myTrip = trip;
    await syncTrip(trip);
    state.stopPhase='depart_campus'; state.pendingStop=null; state.divertedName='';
    renderLogPage();
  }

  // ================= LOG PAGE =================
  function fmtCounts(going, coming, leftBehind){
    const parts = [];
    if(going) parts.push(`Going ${going}`);
    if(coming) parts.push(`Coming ${coming}`);
    if(leftBehind) parts.push(`Left behind ${leftBehind}`);
    return parts.join(" &middot; ");
  }
  function cellTagsHtml(overflow, acknowledged, diverted, noPassengers){
    const tags = [];
    if(noPassengers) tags.push('<span class="tag edited">No Pax</span>');
    if(diverted) tags.push('<span class="tag edited">Diverted</span>');
    if(overflow) tags.push('<span class="tag over">Overflow</span>');
    if(acknowledged) tags.push('<span class="tag ack">&#10003; Seen</span>');
    return tags.length ? ` ${tags.join(" ")}` : "";
  }
  function routeGridTableHtml(routeKey, trips){
    const stops = ROUTES[routeKey] ? ROUTES[routeKey].stops : [];
    const headers = ["Trip #", "Depart AAMU", ...stops, "Arrive AAMU", "Total"];
    const headerHtml = headers.map(h=>`<th>${h}</th>`).join("");
    const rows = trips.map(t=>{
      const cells = [`<td class="tripnum-cell">${t.tripNum}</td>`];
      const departCounts = fmtCounts(t.departGoing, t.departComing, t.departLeftBehind);
      cells.push(`<td${t.departOverflow?' class="overflow-cell"':''}>${t.departAAMU?`<div class="grid-time">${t.departAAMU}</div>`:'—'}${t.departAAMU?`<div class="grid-count">${departCounts}${cellTagsHtml(t.departOverflow,t.departAcknowledged,false,t.noPassengers)}</div>`:''}</td>`);
      let tripTotal = (t.departGoing||0) + (t.departComing||0);
      stops.forEach((stopName,i)=>{
        const s = t.stops[i];
        if(s){
          tripTotal += (s.going||0) + (s.coming||0);
          const stopCounts = fmtCounts(s.going, s.coming, s.leftBehind);
          cells.push(`<td${s.overflow?' class="overflow-cell"':''}>
            <div class="grid-time">Arr ${s.arrive}</div>
            ${s.depart?`<div class="grid-time">Dep ${s.depart}</div>`:''}
            <div class="grid-count">${stopCounts}${cellTagsHtml(s.overflow,s.acknowledged,s.diverted,false)}</div>
          </td>`);
        } else {
          cells.push('<td class="pending-cell">—</td>');
        }
      });
      cells.push(`<td>${t.arriveAAMU || '—'}</td>`);
      cells.push(`<td class="total-cell${t.complete?'':' total-pending'}">${tripTotal}${t.complete?'':'*'}</td>`);
      return `<tr>${cells.join("")}</tr>`;
    }).join("");
    return `
      <div class="grid-route-label">${routeShort(routeKey)}</div>
      <div style="overflow-x:auto;">
        <table class="log-grid"><thead><tr>${headerHtml}</tr></thead><tbody>${rows}</tbody></table>
      </div>
      <div class="totals-note">* Trip still in progress — total will keep climbing until it's complete.</div>
    `;
  }
  function routeTotalsHtml(routeKey){
    const allTrips = [...(state.myTrip?[state.myTrip]:[]), ...state.myCompletedTrips].filter(t=>t.route===routeKey);
    let going=0, coming=0, leftBehind=0;
    allTrips.forEach(t=>{
      going += t.departGoing||0; coming += t.departComing||0; leftBehind += t.departLeftBehind||0;
      t.stops.forEach(s=>{ going += s.going||0; coming += s.coming||0; leftBehind += s.leftBehind||0; });
    });
    return `
      <div class="totals-grid">
        <div class="totals-cell"><div class="totals-num">${going}</div><div class="totals-lbl">Going</div></div>
        <div class="totals-cell"><div class="totals-num">${coming}</div><div class="totals-lbl">Coming</div></div>
        <div class="totals-cell"><div class="totals-num">${going+coming}</div><div class="totals-lbl">Total</div></div>
        <div class="totals-cell"><div class="totals-num${leftBehind?' totals-num-alert':''}">${leftBehind}</div><div class="totals-lbl">Left behind</div></div>
      </div>
    `;
  }
  function activeLogSheetHtml(){
    const allTrips = [...(state.myTrip?[state.myTrip]:[]), ...state.myCompletedTrips];
    if(allTrips.length===0) return '<div class="empty-note">No trips logged yet.</div>';
    const routeOrder = [];
    allTrips.slice().sort((a,b)=>b.tripNum-a.tripNum).forEach(t=>{
      if(!routeOrder.includes(t.route)) routeOrder.push(t.route);
    });
    return routeOrder.map(routeKey=>{
      const tripsForRoute = allTrips.filter(t=>t.route===routeKey).sort((a,b)=>b.tripNum-a.tripNum);
      return routeGridTableHtml(routeKey, tripsForRoute);
    }).join("");
  }

  function renderLogPage(){
    const trip = state.myTrip;
    const route = ROUTES[trip.route];
    const cap = trip.vehicleCapacity || DEFAULT_CAPACITY;

    if(state.changingRoute){
      driverView.innerHTML = `
        <div class="card">
          <div class="card-label">Pick New Route <button class="link-btn" id="cancel-change-route">Cancel</button></div>
          <div id="route-grid-change"></div>
        </div>
      `;
      const grid = document.getElementById("route-grid-change");
      grid.innerHTML = routeGridHtml(trip.route);
      wireRouteGrid(grid, async (key) => {
        if(key === trip.route){ state.changingRoute = false; renderLogPage(); return; }
        if(trip.stops.length>0){
          const ok = confirm(`This trip already has ${trip.stops.length} stop(s) logged under ${routeShort(trip.route)}. Switching to ${routeShort(key)} won't relabel them. Continue?`);
          if(!ok) return;
        }
        trip.route = key; state.shiftRoute = key;
        await syncTrip(trip);
        state.changingRoute = false;
        state.showFullSchedule = false;
        renderLogPage();
      });
      document.getElementById("cancel-change-route").onclick = () => { state.changingRoute = false; renderLogPage(); };
      return;
    }

    const nextStopIdx = trip.stops.length;
    const defaultStopName = route.stops[Math.min(nextStopIdx, route.stops.length-1)];

    driverView.innerHTML = `
      <div class="headsign"><span>EN ROUTE → ${routeShort(trip.route).toUpperCase()}</span></div>
      <div class="card" style="margin-top:12px;">
        <div class="card-label">Trip Info</div>
        <div class="info-row"><span>Date</span><strong>${todayDisplay()}</strong></div>
        <div class="info-row"><span>Driver</span><strong>${trip.driver}</strong></div>
        <div class="info-row"><span>Route</span><strong>${routeShort(trip.route)}</strong></div>
        <div class="info-row"><span>Capacity</span><strong>${cap}</strong></div>
        <div class="info-row"><span>Next Scheduled Run</span><strong>${nextScheduledRun(trip.route)}</strong></div>
        <button class="link-btn" id="change-route-btn" style="margin-top:6px;">Change Route</button>
        <button class="link-btn" id="toggle-schedule-btn" style="margin-top:6px;">${state.showFullSchedule ? 'Collapse Schedule' : 'See Full Schedule'}</button>
        <div id="full-schedule-box" style="display:${state.showFullSchedule?'block':'none'};margin-top:8px;overflow-x:auto;">
          ${state.showFullSchedule ? fullScheduleHtml(trip.route) : ''}
        </div>
      </div>
      ${renderStopPhaseCard(trip, defaultStopName)}
      <div class="card">
        <div class="card-label">Today's Totals &middot; ${routeShort(trip.route)}</div>
        ${routeTotalsHtml(trip.route)}
      </div>
      <div class="card">
        <div class="card-label">Active Log Sheet</div>
        ${activeLogSheetHtml()}
      </div>
      <button class="btn btn-outline big-log-btn" id="end-shift-btn">END SHIFT</button>
    `;

    document.getElementById("change-route-btn").onclick = () => { state.changingRoute = true; renderLogPage(); };
    document.getElementById("toggle-schedule-btn").onclick = () => { state.showFullSchedule = !state.showFullSchedule; renderLogPage(); };
    document.getElementById("end-shift-btn").onclick = () => endShift();
    wireStopPhase(trip, defaultStopName, cap, route);
  }

  function wireStopPhase(trip, defaultStopName, cap, route){
    if(state.stopPhase === 'depart_campus'){
      document.getElementById("fill-now-campus").onclick = () => { document.getElementById("campus-time-input").value = nowTime(); };
      ["going","coming"].forEach(kind=>{
        const box = document.getElementById("stepper-"+kind);
        box.querySelectorAll("button").forEach(btn=>{
          btn.onclick = () => {
            let c = parseInt(box.dataset.count,10);
            c = Math.max(0, c + parseInt(btn.dataset.d,10));
            box.dataset.count = c; box.querySelector(".count").textContent = c;
            box.classList.toggle("over", c > cap);
          };
        });
      });
      const ofToggleC = document.getElementById("overflow-toggle");
      const lbRefineC = document.getElementById("lb-refine");
      const lbBoxC = document.getElementById("stepper-lb");
      ofToggleC.onclick = () => {
        const active = ofToggleC.dataset.active === "1";
        if(active){ ofToggleC.dataset.active="0"; ofToggleC.textContent="NO OVERFLOW"; ofToggleC.classList.remove("active"); lbRefineC.style.display="none"; }
        else { ofToggleC.dataset.active="1"; ofToggleC.textContent="OVERFLOW"; ofToggleC.classList.add("active"); lbRefineC.style.display="block"; }
      };
      lbBoxC.querySelectorAll("button").forEach(btn=>{
        btn.onclick = () => {
          let c = parseInt(lbBoxC.dataset.count,10);
          c = Math.max(1, c + parseInt(btn.dataset.d,10));
          lbBoxC.dataset.count = c; lbBoxC.querySelector(".count").textContent = c;
        };
      });
      document.getElementById("log-campus-depart-btn").onclick = async () => {
        const btn = document.getElementById("log-campus-depart-btn");
        btn.disabled = true; btn.textContent = "Logging…";
        const time = document.getElementById("campus-time-input").value;
        const going = parseInt(document.getElementById("stepper-going").dataset.count,10);
        const coming = parseInt(document.getElementById("stepper-coming").dataset.count,10);
        const overflowActive = ofToggleC.dataset.active === "1";
        const leftBehind = overflowActive ? parseInt(lbBoxC.dataset.count,10) : 0;
        const overflow = going > cap || coming > cap || overflowActive;
        const geo = await getGeo();
        trip.departAAMU = time;
        trip.departMeta = {timestamp:new Date().toISOString(), lat:geo.lat, lng:geo.lng, gpsError:geo.gpsError};
        trip.departGoing = going; trip.departComing = coming; trip.departLeftBehind = leftBehind; trip.departOverflow = overflow; trip.departAcknowledged = false;
        await syncTrip(trip);
        state.stopPhase = 'arriving';
        renderLogPage();
      };
      const noPassBtn = document.getElementById("no-passengers-btn");
      if(noPassBtn){
        noPassBtn.onclick = async () => {
          noPassBtn.disabled = true; noPassBtn.textContent = "Logging…";
          const time = document.getElementById("campus-time-input").value;
          const geo = await getGeo();
          const meta = {timestamp:new Date().toISOString(), lat:geo.lat, lng:geo.lng, gpsError:geo.gpsError};
          trip.departAAMU = time; trip.departMeta = meta;
          trip.departGoing = 0; trip.departComing = 0; trip.departLeftBehind = 0; trip.departOverflow = false; trip.departAcknowledged = false;
          trip.noPassengers = true;
          trip.arriveAAMU = time; trip.arriveMeta = meta;
          trip.complete = true;
          state.myCompletedTrips.push(trip);
          state.myTrip = null;
          await syncTrip(trip);
          await startTripInternal();
        };
      }
      return;
    }
    if(state.stopPhase === 'arrive_campus'){
      document.getElementById("fill-now-campus").onclick = () => { document.getElementById("campus-time-input").value = nowTime(); };
      document.getElementById("log-campus-arrive-btn").onclick = async () => {
        const time = document.getElementById("campus-time-input").value;
        const geo = await getGeo();
        trip.arriveAAMU = time;
        trip.arriveMeta = {timestamp:new Date().toISOString(), lat:geo.lat, lng:geo.lng, gpsError:geo.gpsError};
        trip.complete = true;
        state.myCompletedTrips.push(trip);
        state.myTrip = null;
        await syncTrip(trip);
        await startTripInternal();
      };
      return;
    }
    if(state.stopPhase === 'arriving'){
      document.getElementById("diff-loc-btn").onclick = () => {
        const box = document.getElementById("diff-loc-box");
        box.style.display = box.style.display==='none' ? 'block' : 'none';
        if(box.style.display==='block') document.getElementById("diff-loc-input").focus();
      };
      document.getElementById("fill-now-arrive").onclick = () => { document.getElementById("arrive-time-input").value = nowTime(); };
      document.getElementById("log-arrival-btn").onclick = async () => {
        const diffInput = document.getElementById("diff-loc-input");
        state.divertedName = diffInput ? diffInput.value.trim() : '';
        const name = state.divertedName || defaultStopName;
        const arrive = document.getElementById("arrive-time-input").value;
        const geo = await getGeo();
        state.pendingStop = { name, diverted: !!state.divertedName, arrive, arriveMeta:{timestamp:new Date().toISOString(), lat:geo.lat, lng:geo.lng, gpsError:geo.gpsError} };
        state.stopPhase = 'departing';
        renderLogPage();
      };
      return;
    }
    document.getElementById("fill-now-depart").onclick = () => { document.getElementById("depart-time-input").value = nowTime(); };
    document.getElementById("diff-loc-btn-depart").onclick = () => {
      const box = document.getElementById("diff-loc-box-depart");
      box.style.display = box.style.display==='none' ? 'block' : 'none';
      if(box.style.display==='block') document.getElementById("diff-loc-input-depart").focus();
    };
    ["going","coming"].forEach(kind=>{
      const box = document.getElementById("stepper-"+kind);
      box.querySelectorAll("button").forEach(btn=>{
        btn.onclick = () => {
          let c = parseInt(box.dataset.count,10);
          c = Math.max(0, c + parseInt(btn.dataset.d,10));
          box.dataset.count = c; box.querySelector(".count").textContent = c;
          box.classList.toggle("over", c > cap);
        };
      });
    });
    const ofToggle = document.getElementById("overflow-toggle");
    const lbRefine = document.getElementById("lb-refine");
    const lbBox = document.getElementById("stepper-lb");
    ofToggle.onclick = () => {
      const active = ofToggle.dataset.active === "1";
      if(active){ ofToggle.dataset.active="0"; ofToggle.textContent="NO OVERFLOW"; ofToggle.classList.remove("active"); lbRefine.style.display="none"; }
      else { ofToggle.dataset.active="1"; ofToggle.textContent="OVERFLOW"; ofToggle.classList.add("active"); lbRefine.style.display="block"; }
    };
    lbBox.querySelectorAll("button").forEach(btn=>{
      btn.onclick = () => {
        let c = parseInt(lbBox.dataset.count,10);
        c = Math.max(1, c + parseInt(btn.dataset.d,10));
        lbBox.dataset.count = c; lbBox.querySelector(".count").textContent = c;
      };
    });
    document.getElementById("log-departure-btn").onclick = async () => {
      const btn = document.getElementById("log-departure-btn");
      btn.disabled = true; btn.textContent = "Logging…";
      const depart = document.getElementById("depart-time-input").value;
      const diffInputDepart = document.getElementById("diff-loc-input-depart");
      state.divertedName = diffInputDepart ? diffInputDepart.value.trim() : (state.divertedName||'');
      const finalName = state.divertedName || state.pendingStop.name;
      const going = parseInt(document.getElementById("stepper-going").dataset.count,10);
      const coming = parseInt(document.getElementById("stepper-coming").dataset.count,10);
      const overflowActive = ofToggle.dataset.active === "1";
      const leftBehind = overflowActive ? parseInt(lbBox.dataset.count,10) : 0;
      const overflow = going > cap || coming > cap || overflowActive;
      const geo = await getGeo();
      const departMeta = {timestamp:new Date().toISOString(), lat:geo.lat, lng:geo.lng, gpsError:geo.gpsError};
      const stopRecord = {
        name: finalName, diverted: state.pendingStop.diverted || !!state.divertedName,
        arrive: state.pendingStop.arrive, arriveMeta: state.pendingStop.arriveMeta,
        depart, departMeta, going, coming, leftBehind, overflow, acknowledged:false,
        systemTimestamp: state.pendingStop.arriveMeta.timestamp
      };
      trip.stops.push(stopRecord);
      await syncTrip(trip);
      state.pendingStop = null; state.divertedName='';

      if(trip.stops.length >= route.stops.length){
        state.stopPhase = 'arrive_campus';
      } else {
        state.stopPhase = 'arriving';
      }
      renderLogPage();
    };
  }

  async function endShift(){
    const trip = state.myTrip;
    if(trip){
      const geo = await getGeo();
      const meta = {timestamp:new Date().toISOString(), lat:geo.lat, lng:geo.lng, gpsError:geo.gpsError};
      if(!trip.departAAMU){ trip.departAAMU = nowTime(); trip.departMeta = meta; }
      trip.arriveAAMU = nowTime();
      trip.arriveMeta = meta;
      trip.complete = true;
      state.myCompletedTrips.push(trip);
      state.myTrip = null;
      await syncTrip(trip);
    }

    await saveShiftRecord(state.driverLock.name, state.shiftRecord);

  // ================= DISPATCH VIEW =================
  // ================= LIVE BUS MAP (Passio Go) =================
  // Reverse-engineered from AAMU's public Passio Go map (aamu.passiogo.com) via DevTools —
  // unofficial, not a documented Passio API, so it could break if Passio changes their site.
  const PASSIO_SYSTEM_ID = 2456; // Alabama A&M University
  const AAMU_CENTER = {lat: 34.7826551, lng: -86.5687131};
  let busMapInstance = null;
  let busMapMarkers = [];
  let busMapPollHandle = null;
  function passioDeviceId(){
    if(!state.passioDeviceId) state.passioDeviceId = String(Math.floor(10000000 + Math.random()*89999999));
    return state.passioDeviceId;
  }
  async function fetchPassioBuses(){
    const url = `https://passiogo.com/mapGetData.php?getBuses=2&deviceId=${passioDeviceId()}`;
    const body = new URLSearchParams({systemId: String(PASSIO_SYSTEM_ID), s0: String(PASSIO_SYSTEM_ID), lat: String(AAMU_CENTER.lat), lng: String(AAMU_CENTER.lng)});
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded; charset=UTF-8"},
      body: body.toString()
    });
    if(!res.ok) throw new Error("Passio request failed: "+res.status);
    const data = await res.json();
    console.log("[Passio] raw response", data);
    return data;
  }
  // The buses payload nests as {routeId: [{busId: [lat, lng, ...fields]}, ...]}. This walks it
  // generically and pulls out any bus entry with lat/lng, since the exact field order for a
  // live (non-empty) response hasn't been confirmed yet — check the console log above to refine.
  function parsePassioBuses(data){
    const out = [];
    const busesObj = data && data.buses;
    if(!busesObj) return out;
    Object.keys(busesObj).forEach(routeId=>{
      const arr = busesObj[routeId];
      if(!Array.isArray(arr)) return;
      arr.forEach(busEntry=>{
        Object.keys(busEntry||{}).forEach(busId=>{
          const fields = busEntry[busId];
          if(!Array.isArray(fields) || fields.length < 2) return;
          const lat = parseFloat(fields[0]), lng = parseFloat(fields[1]);
          if(!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0){
            out.push({routeId, busId, lat, lng});
          }
        });
      });
    });
    return out;
  }
  async function initBusMap(){
    if(!busMapInstance){
      busMapInstance = L.map("bus-map").setView([AAMU_CENTER.lat, AAMU_CENTER.lng], 14);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors", maxZoom: 19
      }).addTo(busMapInstance);
      setTimeout(()=>busMapInstance.invalidateSize(), 200);
    }
    await refreshBusMap();
    if(busMapPollHandle) clearInterval(busMapPollHandle);
    busMapPollHandle = setInterval(refreshBusMap, 10000);
  }
  async function refreshBusMap(){
    const statusEl = document.getElementById("map-status");
    try{
      const data = await fetchPassioBuses();
      const buses = parsePassioBuses(data);
      busMapMarkers.forEach(m=>busMapInstance.removeLayer(m));
      busMapMarkers = buses.map(b=>{
        return L.circleMarker([b.lat, b.lng], {radius:8, color:"#7A1F2B", fillColor:"#C9A227", fillOpacity:1, weight:2})
          .bindPopup(`Route ${b.routeId} &middot; Bus ${b.busId}`)
          .addTo(busMapInstance);
      });
      if(statusEl) statusEl.textContent = buses.length ? `${buses.length} vehicle(s) live` : "No active vehicles right now";
    }catch(err){
      console.error("[Passio] fetch failed", err);
      if(statusEl) statusEl.textContent = "Couldn't reach Passio Go — see console for details";
    }
  }

  async function refreshDispatch(){
    const res = await loadDayForWrite();
    if(res.ok){ state.day = res.data; state.lastKnownDay = res.data; }
    else { state.day = state.lastKnownDay; }
    const issues = await loadVehicleIssues();
    state.lastIssues = issues;
    if(state.dispatchTab === 'map' && busMapInstance) return; // don't tear down the live map's DOM every 5s
    renderDispatch(issues);
  }

  async function loadVehicleIssues(){
    try{
      const listRes = await window.storage.list("bts-shift-", true);
      if(!listRes || !listRes.keys) return [];
      const suffix = "-"+todayKey();
      const todayKeys = listRes.keys.filter(k=>k.endsWith(suffix));
      const issues = [];
      for(const key of todayKeys){
        try{
          const r = await window.storage.get(key, true);
          if(!r) continue;
          const rec = JSON.parse(r.value);
          const driverName = key.replace("bts-shift-","").replace(suffix,"");
          const shiftsArr = rec.shifts ? rec.shifts : [rec];
          shiftsArr.forEach(sh=>{
            if(sh.pretrip && sh.pretrip.checklist){
              sh.pretrip.checklist.filter(c=>c.status==='bad').forEach(c=> issues.push({driver:driverName, phase:'Pre-Trip', item:c.item, note:c.note}));
            }
            if(sh.posttrip && sh.posttrip.answers){
              sh.posttrip.answers.filter(a=>a.answer==='yes').forEach(a=> issues.push({driver:driverName, phase:'Post-Trip', item:a.question, note:a.note}));
            }
          });
        }catch(e){}
      }
      return issues;
    }catch(e){ return []; }
  }

  function fmtGeo(lat,lng,gpsError){
    if(lat==null || lng==null) return `<span class="mono">no GPS${gpsError?` (${gpsError})`:''}</span>`;
    const url = `https://www.google.com/maps?q=${lat},${lng}`;
    return `<a class="gps-link" href="${url}" target="_blank" rel="noopener">${lat.toFixed(5)}, ${lng.toFixed(5)}</a>`;
  }

  function computeExceptions(trips){
    const exceptions = [];
    trips.forEach(t=>{
      if(t.complete){
        if(t.noPassengers) return;
        const expected = ROUTES[t.route].stops.length;
        if(t.stops.length < expected) exceptions.push(`Skipped stop(s): ${t.driver} — ${routeShort(t.route)} trip ${t.tripNum} ended with ${t.stops.length}/${expected} stops logged`);
      } else {
        const lastTs = t.stops.length ? t.stops[t.stops.length-1].systemTimestamp : (t.departMeta && t.departMeta.timestamp);
        if(lastTs){
          const mins = (Date.now() - new Date(lastTs).getTime())/60000;
          if(mins > 90) exceptions.push(`No update: ${t.driver} — ${routeShort(t.route)} trip ${t.tripNum} silent for ${Math.round(mins)} min`);
        }
      }
    });
    return exceptions;
  }

  const ROUTE_BOX_LABEL = {
    dean:"Dean", waterleaf:"Waterleaf", combo:"C/W/D", huntsville:"HSV PL",
    elroy1:"Elroy 1", elroy2:"Elroy 2",
    east_night:"East Night", west_night:"West Night",
    east_weekend:"East Wknd/Holiday", west_weekend:"West Wknd/Holiday"
  };
  const ROUTE_BOX_ROWS = [
    {label:"East", keys:["dean","waterleaf","combo"]},
    {label:"West", keys:["huntsville","elroy1","elroy2"]},
    {label:"Nights", keys:["east_night","west_night"]},
    {label:"Weekend/Holiday", keys:["east_weekend","west_weekend"]}
  ];
  function computeRouteSummary(routeKey, trips){
    const routeTrips = trips.filter(t=>t.route===routeKey);
    let going=0, coming=0, hasOverflow=false;
    const events = [];
    let latestDriver = null, latestTs = null;
    routeTrips.forEach(t=>{
      if(t.departAAMU && t.departMeta){
        going += t.departGoing||0; coming += t.departComing||0;
        if(t.departOverflow && !t.departAcknowledged) hasOverflow = true;
        events.push({ts:t.departMeta.timestamp, time:t.departAAMU, location:"Depart AAMU", going:t.departGoing, coming:t.departComing});
        if(!latestTs || new Date(t.departMeta.timestamp) > new Date(latestTs)){ latestTs = t.departMeta.timestamp; latestDriver = t.driver; }
      }
      t.stops.forEach(s=>{
        going += s.going||0; coming += s.coming||0;
        if(s.overflow && !s.acknowledged) hasOverflow = true;
        if(s.depart){
          events.push({ts:s.systemTimestamp, time:s.depart, location:s.name, going:s.going, coming:s.coming});
        }
        if(!latestTs || new Date(s.systemTimestamp) > new Date(latestTs)){ latestTs = s.systemTimestamp; latestDriver = t.driver; }
      });
    });
    events.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
    return {driver: latestDriver, total: going+coming, hasOverflow, events};
  }
  function routeBoxHtml(routeKey, trips){
    const s = computeRouteSummary(routeKey, trips);
    const expanded = state.expandedRouteBoxes.has(routeKey);
    const shown = expanded ? s.events : s.events.slice(0,2);
    return `
      <div class="route-box${s.hasOverflow?' route-box-overflow':''}">
        ${s.hasOverflow ? '<div class="route-box-badge">Overflow</div>' : ''}
        <div class="route-box-title">${ROUTE_BOX_LABEL[routeKey]} <span class="route-box-driver">- Driver: ${s.driver || 'none logged in'}</span></div>
        <div class="route-box-total${s.hasOverflow?' route-box-total-alert':''}">${s.total} rider${s.total===1?'':'s'} today</div>
        <div class="route-box-feed">
          ${shown.length===0 ? '<div class="route-box-empty">No activity yet</div>' :
            shown.map(e=>`
              <div class="route-box-feed-entry">
                <div class="route-box-feed-time">${e.time}</div>
                <div>${e.location}</div>
                <div>${fmtCounts(e.going,e.coming)||'—'}</div>
              </div>
            `).join("")}
          ${s.events.length>2 ? `<div class="route-box-expand" data-expand="${routeKey}">${expanded?'Show less':'Show more'}</div>` : ''}
        </div>
      </div>
    `;
  }
  function routeRowHtml(row, trips){
    const cells = row.keys.map(k=>routeBoxHtml(k, trips)).join("");
    return `
      <div class="route-row-label">${row.label}</div>
      <div class="route-row-grid route-row-grid-${row.keys.length}">${cells}</div>
    `;
  }

  function buildFeedRows(trips, editable){
    return trips.slice().reverse().flatMap(t=>{
      const rows = [];
      if(t.arriveAAMU && t.arriveMeta){
        if(editable && state.editingRow === t.id+':arrive'){
          rows.push(`<tr><td colspan="12"><div class="edit-form">
            <strong style="margin-right:6px;">Arrive AAMU —</strong>
            <label style="font-size:11px;">Time</label>
            <input type="text" id="edit-arrive-time-${t.id}" value="${t.arriveAAMU}" class="wide">
            <button class="link-btn" data-save-trip="${t.id}" data-save-field="arrive">Save</button>
            <button class="link-btn danger" data-cancel-edit="1">Cancel</button>
          </div></td></tr>`);
        } else {
          rows.push(`<tr><td class="mono">${fmtSysTime(t.arriveMeta.timestamp)}</td><td colspan="2">Arrive AAMU: ${t.arriveAAMU}</td><td>${routeShort(t.route)}</td><td>${t.driver}</td><td>AAMU</td><td>—</td><td>—</td><td>—</td><td>${t.vehicleCapacity||DEFAULT_CAPACITY}</td><td>${fmtGeo(t.arriveMeta.lat,t.arriveMeta.lng,t.arriveMeta.gpsError)}</td><td>${editable?`<button class="link-btn" data-edit-trip="${t.id}" data-edit-field="arrive">Edit</button>`:'—'}</td></tr>`);
        }
      }
      t.stops.slice().reverse().forEach(s=>{
        rows.push(`
        <tr class="${s.overflow?'overflow':''}">
          <td class="mono">${fmtSysTime(s.systemTimestamp)}</td>
          <td>${s.arrive}</td><td>${s.depart||'—'}</td>
          <td>${routeShort(t.route)}</td>
          <td>${t.driver}</td>
          <td>${s.name}${s.diverted?' <span class="tag edited">Div</span>':''}</td>
          <td>${s.going}</td><td>${s.coming}</td><td>${s.leftBehind==null?'—':s.leftBehind}</td>
          <td>${t.vehicleCapacity||DEFAULT_CAPACITY}</td>
          <td>${fmtGeo(s.lat||s.arriveMeta&&s.arriveMeta.lat, s.lng||s.arriveMeta&&s.arriveMeta.lng, s.gpsError)}</td>
          <td>${s.overflow ? '<span class="tag over">Overflow</span>' : '<span class="tag ok">OK</span>'}</td>
        </tr>
      `);
      });
      if(t.departAAMU && t.departMeta){
        if(editable && state.editingRow === t.id+':depart'){
          rows.push(`<tr><td colspan="12"><div class="edit-form">
            <strong style="margin-right:6px;">Depart AAMU —</strong>
            <label style="font-size:11px;">Time</label>
            <input type="text" id="edit-depart-time-${t.id}" value="${t.departAAMU}" class="wide">
            <label style="font-size:11px;">Going</label>
            <input type="number" min="0" id="edit-depart-going-${t.id}" value="${t.departGoing||0}">
            <label style="font-size:11px;">Coming</label>
            <input type="number" min="0" id="edit-depart-coming-${t.id}" value="${t.departComing||0}">
            <button class="link-btn" data-save-trip="${t.id}" data-save-field="depart">Save</button>
            <button class="link-btn danger" data-cancel-edit="1">Cancel</button>
          </div></td></tr>`);
        } else {
          rows.push(`<tr class="${t.departOverflow?'overflow':''}"><td class="mono">${fmtSysTime(t.departMeta.timestamp)}</td><td colspan="2">Depart AAMU: ${t.departAAMU}${t.noPassengers?' <span class="tag edited">No Pax</span>':''}</td><td>${routeShort(t.route)}</td><td>${t.driver}</td><td>AAMU</td><td>${t.departGoing||0}</td><td>${t.departComing||0}</td><td>${t.departLeftBehind==null?'—':t.departLeftBehind}</td><td>${t.vehicleCapacity||DEFAULT_CAPACITY}</td><td>${fmtGeo(t.departMeta.lat,t.departMeta.lng,t.departMeta.gpsError)}</td><td>${t.departOverflow?'<span class="tag over">Overflow</span>':'<span class="tag ok">OK</span>'} ${editable?`<button class="link-btn" data-edit-trip="${t.id}" data-edit-field="depart">Edit</button>`:''}</td></tr>`);
        }
      }
      return rows;
    }).join("");
  }

  function feedTableHtml(rows, emptyMessage){
    return `
      <table class="feed">
        <thead><tr><th>Sys</th><th>Arr</th><th>Dep</th><th>Route</th><th>Driver</th><th>Stop</th><th>Going</th><th>Coming</th><th>Left</th><th>Cap</th><th>GPS</th><th>Status</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="12" class="empty-note">${emptyMessage}</td></tr>`}</tbody>
      </table>
    `;
  }

  async function runLogSearch(){
    const dateVal = document.getElementById("search-date").value;
    const routeVal = document.getElementById("search-route").value;
    const resultsBox = document.getElementById("search-results");
    if(!dateVal){ resultsBox.innerHTML = '<div class="empty-note">Pick a date to search.</div>'; return; }
    resultsBox.innerHTML = '<div class="empty-note">Searching…</div>';
    let dayData;
    try{
      const r = await window.storage.get("bts-day-"+dateVal, true);
      dayData = JSON.parse(r.value);
    }catch(e){
      state.lastSearch = {dateVal, routeVal, html: `<div class="empty-note">No log sheets found for ${dateVal}.</div>`};
      resultsBox.innerHTML = state.lastSearch.html;
      return;
    }
    let trips = dayData.trips || [];
    if(routeVal !== "all") trips = trips.filter(t=>t.route===routeVal);
    let html;
    if(trips.length===0){
      html = `<div class="empty-note">No entries for ${dateVal}${routeVal!=="all"?` on ${routeShort(routeVal)}`:''}.</div>`;
    } else {
      html = feedTableHtml(buildFeedRows(trips), "No entries match.");
    }
    state.lastSearch = {dateVal, routeVal, html};
    resultsBox.innerHTML = html;
  }

  function renderDispatch(issues){
    const trips = state.day.trips;
    const going = trips.reduce((s,t)=>s+(t.departGoing||0)+t.stops.reduce((a,x)=>a+(x.going||0),0),0);
    const coming = trips.reduce((s,t)=>s+(t.departComing||0)+t.stops.reduce((a,x)=>a+(x.coming||0),0),0);
    const leftBehind = trips.reduce((s,t)=>s+(t.departLeftBehind||0)+t.stops.reduce((a,x)=>a+(x.leftBehind||0),0),0);
    const openAlerts = [];
    trips.forEach(t=>{
      if(t.departOverflow && !t.departAcknowledged){
        openAlerts.push({tripId:t.id, stopIdx:-1, route:routeShort(t.route), driver:t.driver, stop:"AAMU (Depart)",
                          going:t.departGoing, coming:t.departComing, leftBehind:t.departLeftBehind, cap:t.vehicleCapacity||DEFAULT_CAPACITY, time:t.departAAMU});
      }
      t.stops.forEach((s,i)=>{
        if(s.overflow && !s.acknowledged){
          openAlerts.push({tripId:t.id, stopIdx:i, route:routeShort(t.route), driver:t.driver, stop:s.name,
                            going:s.going, coming:s.coming, leftBehind:s.leftBehind, cap:t.vehicleCapacity||DEFAULT_CAPACITY, time:s.arrive});
        }
      });
    });

    const marquee = openAlerts.length
      ? `<div class="headsign alert"><span>⚠ ${openAlerts.length} OVERFLOW ALERT${openAlerts.length>1?'S':''}: ` +
        openAlerts.map(a=>`${a.route.toUpperCase()} — ${a.stop.toUpperCase()} (${Math.max(a.going,a.coming)}/${a.cap}${a.leftBehind?`, ${a.leftBehind} left behind`:''})`).join("   •   ") +
        `</span></div>`
      : `<div class="headsign"><span>ALL ROUTES NORMAL — NO OVERFLOW ALERTS</span></div>`;

    const routeOptions = Object.keys(ROUTES).map(k=>`<option value="${k}">${routeShort(k)}</option>`).join("");
    state.lastIssues = issues;

    dispatchView.innerHTML = `
      ${marquee}
      <div class="tab-bar" style="display:flex;gap:8px;margin:14px 0;">
        <button class="tab-btn ${state.dispatchTab==='live'?'active':''}" id="tab-live-btn">Today</button>
        <button class="tab-btn ${state.dispatchTab==='search'?'active':''}" id="tab-search-btn">Search Log Sheets</button>
        <button class="tab-btn ${state.dispatchTab==='map'?'active':''}" id="tab-map-btn">GPS</button>
      </div>

      <div id="pane-map" style="display:${state.dispatchTab==='map'?'block':'none'};">
        <div class="card">
          <div class="card-label">Live Bus Map <span class="mono" id="map-status">Loading…</span></div>
          <div id="bus-map" style="height:420px;border-radius:10px;overflow:hidden;border:1px solid var(--line);"></div>
          <div class="disclosure" style="margin-top:10px;">Pulled directly from Passio Go's live data feed. If no vehicles are running (e.g. school break), the map will just show no markers — that's expected, not an error.</div>
        </div>
        <div class="card">
          <div class="card-label">Traffic</div>
          <a href="https://algotraffic.com/map" target="_blank" rel="noopener" class="btn btn-outline" style="display:inline-block;text-decoration:none;width:auto;">Open ALGO Traffic (ALDOT)</a>
          <div class="disclosure" style="margin-top:10px;">Opens Alabama DOT's live traffic camera and incident map in a new tab.</div>
        </div>
      </div>

      <div id="pane-search" style="display:${state.dispatchTab==='search'?'block':'none'};">
        <div class="card">
          <div class="card-label">Search Log Sheets</div>
          <div class="field-row">
            <div class="field"><label>Date</label><input type="date" id="search-date" value="${state.lastSearch?state.lastSearch.dateVal:todayKey()}"></div>
            <div class="field"><label>Route</label>
              <select id="search-route">
                <option value="all" ${state.lastSearch&&state.lastSearch.routeVal==='all'?'selected':''}>All Routes</option>
                ${Object.keys(ROUTES).map(k=>`<option value="${k}" ${state.lastSearch&&state.lastSearch.routeVal===k?'selected':''}>${routeShort(k)}</option>`).join("")}
              </select>
            </div>
          </div>
          <button class="btn btn-primary btn-small" id="search-btn" style="width:auto;">Search</button>
          <div id="search-results" style="margin-top:12px;">${state.lastSearch ? state.lastSearch.html : ''}</div>
        </div>
      </div>

      <div id="pane-live" style="display:${state.dispatchTab==='live'?'block':'none'};">
        <div class="mono" style="color:var(--muted);margin-bottom:10px;">${todayDisplay()}</div>
        <div class="dispatch-today-grid">
          <div class="dispatch-sidebar">
            <div class="card">
              <div class="card-label">Total Riders Today</div>
              <div style="font-size:40px;font-weight:800;color:var(--maroon);text-align:center;">${going+coming}</div>
            </div>
            <div class="card">
              <div class="card-label">Open Overflow Alerts</div>
              <div id="alerts-box">
                ${openAlerts.length===0 ? '<div class="empty-note">No open alerts.</div>' :
                  openAlerts.map(a=>`
                    <div class="alert-item">
                      <div><div class="a-txt">${a.route} — ${a.stop}: ${Math.max(a.going,a.coming)} riders (cap ${a.cap})${a.leftBehind?`, ${a.leftBehind} left behind`:''}</div>
                      <div class="a-time">Driver ${a.driver} · logged ${a.time}</div></div>
                      <button class="btn btn-outline btn-small" data-trip="${a.tripId}" data-stop="${a.stopIdx}">Acknowledge</button>
                    </div>
                  `).join("")}
              </div>
            </div>
            <div class="card">
              <div class="card-label">Vehicle Inspection Issues</div>
              ${issues.length===0 ? '<div class="empty-note">No issues reported today.</div>' : issues.map(i=>`<div class="issue-item">${i.phase} — ${i.driver}: ${i.item}${i.note?` — "${i.note}"`:''}</div>`).join("")}
            </div>
          </div>
          <div class="dispatch-routes">
            ${ROUTE_BOX_ROWS.map(row=>routeRowHtml(row, trips)).join("")}
          </div>
        </div>
      </div>
    `;

    document.querySelectorAll("[data-expand]").forEach(el=>{
      el.onclick = () => {
        const k = el.dataset.expand;
        if(state.expandedRouteBoxes.has(k)) state.expandedRouteBoxes.delete(k); else state.expandedRouteBoxes.add(k);
        renderDispatch(state.lastIssues);
      };
    });
    document.getElementById("tab-live-btn").onclick = () => { if(busMapPollHandle) clearInterval(busMapPollHandle); busMapInstance = null; busMapMarkers = []; state.dispatchTab = 'live'; renderDispatch(state.lastIssues); };
    document.getElementById("tab-search-btn").onclick = () => { if(busMapPollHandle) clearInterval(busMapPollHandle); busMapInstance = null; busMapMarkers = []; state.dispatchTab = 'search'; renderDispatch(state.lastIssues); };
    document.getElementById("tab-map-btn").onclick = () => { state.dispatchTab = 'map'; renderDispatch(state.lastIssues); };
    if(state.dispatchTab === 'map') initBusMap();
    document.getElementById("search-btn").onclick = runLogSearch;

    dispatchView.querySelectorAll("[data-trip]").forEach(btn=>{
      btn.onclick = async () => {
        const res = await loadDayForWrite();
        if(!res.ok) return;
        const day = res.data;
        const trip = day.trips.find(t=>t.id===btn.dataset.trip);
        if(trip){
          const idx = parseInt(btn.dataset.stop,10);
          if(idx===-1) trip.departAcknowledged = true; else trip.stops[idx].acknowledged = true;
          await saveDay(day);
        }
        await refreshDispatch();
      };
    });

    dispatchView.querySelectorAll("[data-edit-trip]").forEach(btn=>{
      btn.onclick = () => {
        state.editingRow = btn.dataset.editTrip + ":" + btn.dataset.editField;
        renderDispatch(state.lastIssues);
      };
    });
    dispatchView.querySelectorAll("[data-cancel-edit]").forEach(btn=>{
      btn.onclick = () => { state.editingRow = null; renderDispatch(state.lastIssues); };
    });
    dispatchView.querySelectorAll("[data-save-trip]").forEach(btn=>{
      btn.onclick = async () => {
        const tripId = btn.dataset.saveTrip, field = btn.dataset.saveField;
        btn.disabled = true; btn.textContent = "Saving…";
        const res = await loadDayForWrite();
        if(!res.ok){ alert("Couldn't save — connection issue, please try again."); btn.disabled=false; btn.textContent="Save"; return; }
        const day = res.data;
        const trip = day.trips.find(t=>t.id===tripId);
        if(trip){
          if(field === 'arrive'){
            trip.arriveAAMU = document.getElementById(`edit-arrive-time-${tripId}`).value;
          } else {
            trip.departAAMU = document.getElementById(`edit-depart-time-${tripId}`).value;
            trip.departGoing = parseInt(document.getElementById(`edit-depart-going-${tripId}`).value,10) || 0;
            trip.departComing = parseInt(document.getElementById(`edit-depart-coming-${tripId}`).value,10) || 0;
            const cap = trip.vehicleCapacity || DEFAULT_CAPACITY;
            trip.departOverflow = trip.departGoing > cap || trip.departComing > cap;
          }
          await saveDay(day);
        }
        state.editingRow = null;
        await refreshDispatch();
      };
    });
  }
})();
</script>

</body>
</html>
