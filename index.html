  async function loadDriverSignIns(dateStr){
    dateStr = dateStr || todayKey();
    try{
      const listRes = await window.storage.list("bts-shift-", true);
      if(!listRes || !listRes.keys) return [];
      const suffix = "-"+dateStr;
      const dateKeys = listRes.keys.filter(k=>k.endsWith(suffix));
      const signIns = [];
      for(const key of dateKeys){
        try{
          const r = await window.storage.get(key, true);
          if(!r) continue;
          const rec = JSON.parse(r.value);
          const driverName = key.replace("bts-shift-","").replace(suffix,"");
          if(rec.loginLog && rec.loginLog.length){
            rec.loginLog.forEach(l=> signIns.push({driver:driverName, timestamp:l.timestamp, lat:l.lat, lng:l.lng, gpsError:l.gpsError}));
          }
        }catch(e){}
      }
      signIns.sort((a,b)=> new Date(a.timestamp) - new Date(b.timestamp));
      return signIns;
    }catch(e){ return []; }
  }

  async function loadVehicleIssues(){
    try{
      const listRes = await window.storage.list("bts-shift-", true);
      if(!listRes || !listRes.keys) return [];
      const suffix = "-"+todayKey();
      const todayKeys = listRes.keys.filter(k=>k.endsWith(suffix));
      const issues = [];
      for(const key of todayKeys){
        try{
          const r = await window.storage.get(key, true);
          if(!r) continue;
          const rec = JSON.parse(r.value);
          const driverName = key.replace("bts-shift-","").replace(suffix,"");
          const shiftsArr = rec.shifts ? rec.shifts : [rec];
          shiftsArr.forEach(sh=>{
            if(sh.pretrip && sh.pretrip.checklist){
              sh.pretrip.checklist.filter(c=>c.status==='bad').forEach(c=> issues.push({driver:driverName, phase:'Pre-Trip', item:c.item, note:c.note}));
            }
            if(sh.posttrip && sh.posttrip.answers){
              sh.posttrip.answers.filter(a=>a.answer==='yes').forEach(a=> issues.push({driver:driverName, phase:'Post-Trip', item:a.question, note:a.note}));
            }
          });
        }catch(e){}
      }
      return issues;
    }catch(e){ return []; }
  }

  function firstSignInsByDriver(signIns){
    const byDriver = {};
    signIns.forEach(s=>{
      if(!byDriver[s.driver]) byDriver[s.driver] = {first:s, count:0};
      byDriver[s.driver].count++;
    });
    return Object.keys(byDriver).sort().map(d=>({driver:d, ...byDriver[d]}));
  }

  function computeExceptions(trips){
    const exceptions = [];
    trips.forEach(t=>{
      if(t.complete){
        if(t.noPassengers) return;
        const expected = ROUTES[t.route].stops.length;
        if(t.stops.length < expected) exceptions.push(`Skipped stop(s): ${t.driver} — ${routeShort(t.route)} trip ${t.tripNum} ended with ${t.stops.length}/${expected} stops logged`);
      } else {
        const lastTs = t.stops.length ? t.stops[t.stops.length-1].systemTimestamp : (t.departMeta && t.departMeta.timestamp);
        if(lastTs){
          const mins = (Date.now() - new Date(lastTs).getTime())/60000;
          if(mins > 90) exceptions.push(`No update: ${t.driver} — ${routeShort(t.route)} trip ${t.tripNum} silent for ${Math.round(mins)} min`);
        }
      }
    });
    return exceptions;
  }

  const ROUTE_BOX_LABEL = {
    dean:"Dean", waterleaf:"Waterleaf", elroy:"Elroy", hsv_elroy:"HSV PL/Elroy",
    east_night:"East Night", west_night:"West Night",
    east_weekend:"East Wknd/Holiday", west_weekend:"West Wknd/Holiday"

  const ROUTE_BOX_ROWS = [
    {label:"East", keys:["dean","waterleaf"]},
    {label:"West", keys:["elroy","hsv_elroy"]},
    {label:"Nights", keys:["east_night","west_night"]},

  ];
  function computeRouteSummary(routeKey, trips){
    const routeTrips = trips.filter(t=>t.route===routeKey);
    let going=0, coming=0, hasOverflow=false, routeChange=null;
    const events = [];
    let latestDriver = null, latestTs = null;
    routeTrips.forEach(t=>{
      if(t.routeChangeAlert && !t.routeChangeAlert.acknowledged) routeChange = {...t.routeChangeAlert, driver:t.driver, tripId:t.id};
      if(t.departAAMU && t.departMeta){
        going += t.departGoing||0; coming += t.departComing||0;
        if(t.departOverflow && !t.departAcknowledged) hasOverflow = true;
        events.push({ts:t.departMeta.timestamp, time:t.departAAMU, location:"Depart AAMU", going:t.departGoing, coming:t.departComing});
        if(!latestTs || new Date(t.departMeta.timestamp) > new Date(latestTs)){ latestTs = t.departMeta.timestamp; latestDriver = t.driver; }
      }
      t.stops.forEach(s=>{
        going += s.going||0; coming += s.coming||0;
        if(s.overflow && !s.acknowledged) hasOverflow = true;
        if(s.depart){
          events.push({ts:s.systemTimestamp, time:s.depart, location:s.name, going:s.going, coming:s.coming});
        }
        if(!latestTs || new Date(s.systemTimestamp) > new Date(latestTs)){ latestTs = s.systemTimestamp; latestDriver = t.driver; }
      });
    });
    events.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
    return {driver: latestDriver, total: going+coming, hasOverflow, routeChange, events};
  }

  async function computeConsolidatedRidership(dateStr, routeVal){
    let trips = [];
    try{
      const r = await window.storage.get("bts-day-"+dateStr, true);
      trips = (JSON.parse(r.value).trips) || [];
    }catch(e){ trips = []; }
    const routeKeys = routeVal==='all' ? Object.keys(ROUTES) : [routeVal];
    const rows = routeKeys.map(rk=>{
      let going=0, coming=0;
      trips.filter(t=>t.route===rk).forEach(t=>{
        going += t.departGoing||0; coming += t.departComing||0;
        t.stops.forEach(s=>{ going += s.going||0; coming += s.coming||0; });
      });
      return {route:rk, going, coming, total:going+coming};
    });
    const grandGoing = rows.reduce((s,r)=>s+r.going,0);
    const grandComing = rows.reduce((s,r)=>s+r.coming,0);
    return {rows, grandGoing, grandComing, grandTotal:grandGoing+grandComing};
  }

    return `
      <div class="grid-route-label">${dateStr}</div>
      <table class="log-grid"><thead><tr><th>Route</th><th>Going</th><th>Coming</th><th>Total</th></tr></thead>
      <tbody>
        ${data.rows.map(r=>`<tr><td>${routeShort(r.route)}</td><td>${r.going}</td><td>${r.coming}</td><td>${r.total}</td></tr>`).join("")}
        <tr style="font-weight:800;"><td>All Routes</td><td>${data.grandGoing}</td><td>${data.grandComing}</td><td>${data.grandTotal}</td></tr>
      </tbody></table>
    `;
  }

  async function runConsolidatedExport(){
    const startVal = document.getElementById("consolidated-start-date").value;

    const routeVal = document.getElementById("consolidated-route").value;
    const statusEl = document.getElementById("consolidated-export-status");

    const dates = dateRangeList(startVal, endVal);
    const rows = [];
    for(const d of dates){
      const data = await computeConsolidatedRidership(d, routeVal);
      data.rows.forEach(r=> rows.push({Date:d, Route:routeShort(r.route), Going:r.going, Coming:r.coming, Total:r.total}));
      rows.push({Date:d, Route:"All Routes", Going:data.grandGoing, Coming:data.grandComing, Total:data.grandTotal});
    }
    if(rows.length===0){ statusEl.innerHTML = '<div class="empty-note">No data found for that range.</div>'; return; }
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Consolidated");
    const filename = `BTS-Consolidated-Ridership-${startVal}-to-${endVal}.xlsx`;
    XLSX.writeFile(wb, filename);
    statusEl.innerHTML = `<div class="empty-note">Downloaded ${filename} — ${rows.length} rows.</div>`;

  function dateRangeList(startStr, endStr){
    const dates = [];
    let cur = new Date(startStr+"T00:00:00");
    const end = new Date(endStr+"T00:00:00");
    while(cur <= end){
      dates.push(cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0"));
      cur.setDate(cur.getDate()+1);
    }
    return dates;
  }
  async function runRidershipExport(){

    statusEl.innerHTML = '<div class="empty-note">Gathering data…</div>';
    const dates = dateRangeList(startVal, endVal);
    const rows = [];
    for(const dateStr of dates){
      let trips = [];
      try{
        const r = await window.storage.get("bts-day-"+dateStr, true);
        trips = (JSON.parse(r.value).trips) || [];
      }catch(e){ continue; } // no data for this date, skip
      if(routeVal !== "all") trips = trips.filter(t=>t.route===routeVal);
      trips.forEach(t=>{
        if(t.departAAMU && t.departMeta){
          rows.push({
            Date: dateStr, Route: routeShort(t.route), Driver: t.driver, "Trip #": t.tripNum,
            Event: "Depart AAMU", Time: t.departAAMU, Going: t.departGoing||0, Coming: t.departComing||0,
            "Left Behind": t.departLeftBehind||0, Overflow: t.departOverflow?"Yes":"No",
            Diverted: "No", "No Passengers": t.noPassengers?"Yes":"No"
          });
        }
        t.stops.forEach(s=>{
          if(!s.depart) return; // only departed stops carry ridership counts
          rows.push({
            Date: dateStr, Route: routeShort(t.route), Driver: t.driver, "Trip #": t.tripNum,
            Event: s.name, Time: s.depart, Going: s.going||0, Coming: s.coming||0,
            "Left Behind": s.leftBehind||0, Overflow: s.overflow?"Yes":"No",

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();

            trip.departComing = parseInt(document.getElementById(`edit-depart-coming-${tripId}`).value,10) || 0;
            const cap = trip.vehicleCapacity || DEFAULT_CAPACITY;
            trip.departOverflow = trip.departGoing > cap || trip.departComing > cap;
          }
          await saveDay(day);
        }
        state.editingRow = null;
        await refreshDispatch();
      };
    });
  }
})();
</script>

</body>
</html>
