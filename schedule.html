<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BTS Schedule — Supervisors</title>
<style>
  :root{
    --bg:#FAF7F2; --ink:#221B1A; --maroon:#6E1E2C; --maroon-dark:#4A1420;
    --gold:#C7973F; --teal:#2F6E62; --slate:#55504A; --line:#E4DDD2; --danger:#A63A2E; --card:#FFFFFF; --trip:#3E6B8A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;}
  .display{font-family:"Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .mono{font-family:"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums;}
  header{background:var(--maroon);color:#fff;padding:20px 28px;border-bottom:4px solid var(--gold);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}
  header h1{margin:0 0 4px 0;font-size:21px;letter-spacing:.06em;}
  header p{margin:0;color:#EAD9CF;font-size:12.5px;}
  .savebadge{font-size:11px;color:#EAD9CF;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 24px 60px;}
  .maintabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .maintab{padding:9px 18px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--slate);}
  .maintab.active{background:var(--maroon-dark);color:#fff;border-color:var(--maroon-dark);}
  .maintab.hasalert::after{content:"•";color:var(--danger);margin-left:5px;font-size:16px;}
  .daytabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .daytab{padding:8px 16px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--slate);text-align:left;}
  .daytab.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}
  .daytab .n{display:block;font-size:9.5px;font-weight:400;opacity:.8;}
  .daytab.hasgap{border-color:var(--danger);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px;position:relative;}
  .card h2{font-size:12.5px;margin:0 0 10px 0;color:var(--maroon-dark);letter-spacing:.03em;}
  .axis{display:grid;margin-left:230px;position:relative;height:20px;border-bottom:1px solid var(--line);margin-bottom:6px;}
  .axis span{position:absolute;top:0;font-size:10px;color:#8a7d76;transform:translateX(-50%);}
  .grp-label{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#8a7d76;margin:12px 0 4px 0;}
  .row{display:flex;align-items:center;margin-bottom:6px;min-height:26px;}
  .rlabel{width:230px;flex:none;font-size:12px;padding-right:10px;}
  .rlabel b{display:block;font-size:12.5px;}
  .rlabel span{font-size:10.5px;color:#8a7d76;}
  .track{position:relative;flex:1;height:22px;background:#F3EEE6;border-radius:3px;}
  .seg{position:absolute;top:0;height:100%;border-radius:3px;font-size:10.5px;color:#fff;display:flex;align-items:center;padding-left:6px;overflow:hidden;white-space:nowrap;cursor:pointer;border:1px solid transparent;}
  .seg:hover{border-color:#fff;filter:brightness(1.08);}
  .seg.cdl::after{content:"CDL";margin-left:6px;background:rgba(255,255,255,.25);padding:0 4px;border-radius:2px;font-size:8.5px;}
  .ghost{border:1px dashed #C7973F;background:repeating-linear-gradient(45deg,#F7EFDD,#F7EFDD 6px,#FBF3E1 6px,#FBF3E1 12px);color:#8A6A2E;cursor:default;}
  .seg.gap{background:var(--danger)!important;font-weight:700;}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:#5c5350;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .relief-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .relief-item:last-child{border-bottom:none;}
  .off{color:var(--danger);font-weight:600;}
  .on{color:var(--teal);font-weight:600;}
  .toggle{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 10px;font-size:11px;cursor:pointer;font-weight:600;}
  .fleet-chip{display:inline-block;background:#F3EEE6;border-radius:4px;padding:4px 9px;margin:3px 4px 3px 0;font-size:11.5px;}
  .note{font-size:11.5px;color:#8a7d76;margin-top:2px;}
  .notelist{margin:0;padding-left:18px;font-size:12px;}
  .notelist li{margin-bottom:6px;}
  .empty{font-size:12.5px;color:#8a7d76;font-style:italic;padding:10px 0;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .stat{border-radius:6px;padding:14px 16px;}
  .stat.danger{background:#FBEEEC;border:1px solid #E3B7AE;}
  .stat.ok{background:#EEF6F1;border:1px solid #BFD8CE;}
  .stat.info{background:#F3EEE6;border:1px solid var(--line);}
  .stat b{display:block;font-size:24px;}
  .stat.danger b{color:var(--danger);}
  .stat.ok b{color:var(--teal);}
  .stat.info b{color:var(--maroon-dark);}
  .stat span{font-size:11px;color:#5c5350;}
  .concern{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:5px;background:#FBEEEC;border:1px solid #E3B7AE;margin-bottom:8px;gap:10px;}
  .concern .info{font-size:12.5px;}
  .concern .info b{display:block;font-size:13px;color:var(--danger);}
  .fixbtn{background:var(--maroon);color:#fff;border:none;padding:7px 14px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .fixbtn:hover{background:var(--maroon-dark);}
  .editor{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px;width:260px;}
  .editor label{font-size:11px;color:#8a7d76;display:block;margin-bottom:4px;}
  .editor input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-size:13px;margin-bottom:10px;}
  .editor .btnrow{display:flex;gap:8px;justify-content:flex-end;}
  .editor button{padding:6px 12px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;}
  .editor button.save{background:var(--maroon);color:#fff;border-color:var(--maroon);}
  .overlay{position:fixed;inset:0;z-index:49;background:transparent;}
  table.grid{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
  table.grid th:first-child, table.grid td:first-child{width:15%;}
  .ns-toggle-row{display:flex;align-items:center;gap:5px;margin-top:5px;}
  .ns-switch{position:relative;width:30px;height:16px;background:#D9D0C0;border-radius:9px;flex:none;cursor:pointer;}
  .ns-switch .ns-knob{position:absolute;top:2px;left:2px;width:12px;height:12px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s;}
  .ns-switch.on{background:var(--gold);}
  .ns-switch.on .ns-knob{left:16px;}
  .ns-toggle-label{font-size:8.5px;color:#8a7d76;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  table.grid th.ns-on{background:#FBF3E1;}
  table.grid th.ns-on .ns-toggle-label{color:var(--maroon-dark);}
  td.ns-cell{text-align:center;color:#8a7d76;background:#FBF7F0;font-size:11px;}
  table.grid th:last-child, table.grid td:last-child{width:15%;}
  table.grid th{background:#F3EEE6;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#8a7d76;padding:7px 6px;text-align:left;border:1px solid var(--line);}
  table.grid td{padding:4px 6px;border:1px solid var(--line);}
  table.grid input, table.grid select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;}
  table.grid td.muted{color:#c8beb2;text-align:center;}
  .form-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px;align-items:end;}
  .form-row div{display:flex;flex-direction:column;gap:3px;}
  .form-row label{font-size:10.5px;color:#8a7d76;}
  .form-row input,.form-row select{padding:7px 8px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;}
  .addbtn{background:var(--maroon);color:#fff;border:none;padding:8px 16px;border-radius:5px;font-size:12.5px;font-weight:600;cursor:pointer;height:34px;}
  .delbtn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;}
  .hrow{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center;}
  .hrow:last-child{border-bottom:none;}
  .hrow.over{background:#FBEEEC;}
  .badge{font-size:10px;background:var(--danger);color:#fff;padding:2px 7px;border-radius:10px;font-weight:700;}
  .trip-item, .callout-item{padding:8px 10px;border-radius:5px;background:#F3EEE6;margin-bottom:6px;font-size:12px;}
  .trip-item b, .callout-item b{color:var(--maroon-dark);}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  // ---- Firebase config: same project as the BTS Driver Log app ----
  // Get these values from: Firebase console -> Project settings -> General ->
  // "Your apps" -> the existing web app -> SDK setup and configuration.
  const firebaseConfig = {
    apiKey: "AIzaSyAAtag4wPxi0lGyXaqOIyIFoSBvNPMpZZg",
    authDomain: "bts-driver-log.firebaseapp.com",
    databaseURL: "https://bts-driver-log-default-rtdb.firebaseio.com",
    projectId: "bts-driver-log",
    storageBucket: "bts-driver-log.firebasestorage.app",
    messagingSenderId: "203074744997",
    appId: "1:203074744997:web:5e88ea17ed9c005ad1d34c"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // window.storage-compatible shim: shared=true -> Firebase (under /schedule, a
  // sibling path to the driver log's /data, so the two never collide), shared=false
  // -> localStorage. The rest of the app calls window.storage.get/set exactly like
  // it did with Claude's built-in storage, so nothing else needed to change.
  window.storage = {
    async get(key, shared){
      if(!shared){
        try{ const v = localStorage.getItem(key); return v!==null ? {key, value:v, shared:false} : null; }
        catch(e){ return null; }
      }
      const snap = await db.ref('schedule/' + key).once('value');
      const val = snap.val();
      return val !== null ? {key, value: val, shared:true} : null;
    },
    async set(key, value, shared){
      if(!shared){
        try{ localStorage.setItem(key, value); return {key, value, shared:false}; }
        catch(e){ return null; }
      }
      await db.ref('schedule/' + key).set(value);
      return {key, value, shared:true};
    },
    async delete(key, shared){
      if(!shared){ try{ localStorage.removeItem(key); }catch(e){} return {key, deleted:true, shared:false}; }
      await db.ref('schedule/' + key).remove();
      return {key, deleted:true, shared:true};
    },
    async list(prefix, shared){
      if(!shared) return null; // not used by this app
      const snap = await db.ref('schedule').once('value');
      const all = snap.val() || {};
      const keys = Object.keys(all).filter(k => !prefix || k.startsWith(prefix));
      return {keys, prefix, shared:true};
    }
  };

// so the two can be cross-referenced. On-campus routes use the driver app's

// Fetches today's trip log straight from the Driver Log app's Firebase data
// (path "data/bts-day-<date>", the same project, a sibling of this app's "schedule/" path).
// Returns null on any failure (offline, placeholder config, no data yet) so callers
// can fall back to estimates without crashing.
async function fetchLiveRidershipToday(){
  try{
    const dateISO = WEEK[getTodayLabel()];
    const snap = await db.ref('data/bts-day-' + dateISO).once('value');
    const dayData = snap.val();
    if(!dayData) return null;
    const raw = typeof dayData === 'string' ? JSON.parse(dayData) : dayData;
    const trips = raw.trips || [];
    const byRouteKey = {};
    trips.forEach(t=>{
      if(!byRouteKey[t.route]) byRouteKey[t.route] = {going:0, coming:0, leftBehind:0, overflow:false, lastEvent:null};
      const b = byRouteKey[t.route];
      if(t.departAAMU){
        b.going += t.departGoing||0; b.coming += t.departComing||0; b.leftBehind += t.departLeftBehind||0;
        if(t.departOverflow) b.overflow = true;
        if(!b.lastEvent || t.departAAMU > b.lastEvent) b.lastEvent = t.departAAMU;
      }
      (t.stops||[]).forEach(s=>{
        b.going += s.going||0; b.coming += s.coming||0; b.leftBehind += s.leftBehind||0;
        if(s.overflow) b.overflow = true;
      });
    });
    return byRouteKey; // keyed by driver-app route key, e.g. "waterleaf"
  }catch(e){
    return null;
  }
}

function migrateData(d){
  d.routes = d.routes.filter(r=>{
    if(r.name==="Bulldog 2") return false;
    if(r.name==="Bulldog 1" && !r.shifts2) return false;
    return true;
  });
  if(!d.routes.some(r=>r.name==="Bulldog 1")){
    const fresh = JSON.parse(JSON.stringify(DEFAULT_DATA.routes.find(r=>r.name==="Bulldog 1")));
    d.routes.splice(1, 0, fresh);
  }
  d.routes.forEach(r=>{
    if(r.days) Object.keys(r.days).forEach(day=>{ r.days[day] = renameDriverString(r.days[day]); });
    if(r.shifts2) Object.values(r.shifts2).forEach(arr=>arr.forEach(s=>{ s.driver = renameDriverString(s.driver); }));
    if(r.lunch) Object.values(r.lunch).forEach(l=>{ l.driver = renameDriverString(l.driver); });
  });
  d.relief.forEach(rel=>{
    if(rel.name.startsWith("Off-Day Relief") && rel.days.Fri !== undefined) delete rel.days.Fri;
    rel.name = rel.name.replace("Brandi P","Brandi");
  });
  if(!d.callouts) d.callouts=[];
  if(!d.trips) d.trips=[];
  d.trips.forEach(t=>{
    if(!t.status) t.status="Pending";
    if(!Array.isArray(t.drivers)) t.drivers = t.drivers ? [t.drivers] : [];
    t.drivers = t.drivers.map(renameDriverString).filter(Boolean);
  });
  d.callouts.forEach(c=>{ c.driver = renameDriverString(c.driver); if(c.replacement) c.replacement = renameDriverString(c.replacement); });
  if(!d.history) d.history={};
  if(!d.weekOverrides) d.weekOverrides={};
  if(!d.holidays) d.holidays={};
  Object.values(d.holidays).forEach(h=>{
    if(!h.assignments) h.assignments = {};
    ["East WKND","West WKND"].forEach(r=>{ if(!h.assignments[r]) h.assignments[r] = "UNASSIGNED"; });
  });
  if(!d.staffing) d.staffing = {};
  Object.keys(DEFAULT_STAFFING).forEach(name=>{
    if(!d.staffing[name]) d.staffing[name] = JSON.parse(JSON.stringify(DEFAULT_STAFFING[name]));
  });
  applyLunchDefaults(d);
}

  const ap=h>=12?'PM':'AM'; let h12=h%12; if(h12===0)h12=12;
  return `${h12}:${m.toString().padStart(2,'0')}${ap}`;
}
function isoDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function statusColor(s){ return s==="Completed"?"#2F6E62":s==="Cancelled"?"#8a7d76":"#C7973F"; }

function fmtDate(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function getWeekDates(){
  const now = new Date();
  const dow = now.getDay();
  const diffToMonday = (dow===0? -6 : 1-dow);
  const monday = new Date(now.getFullYear(),now.getMonth(),now.getDate()+diffToMonday);
  const map = {};
  DAYS.forEach((d,i)=>{ const dt=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i); map[d]=isoDate(dt); });
  return map;
}
const WEEK = getWeekDates();
function mondayISOFrom(dateStr){
  const [y,m,dd] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, dd);
  const dow = dt.getDay();
  const diff = dow===0 ? -6 : 1-dow;
  const mon = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()+diff);
  return isoDate(mon);
}
function weekDatesFromMonday(mondayISOStr){
  const [y,m,dd] = mondayISOStr.split('-').map(Number);
  const mon = new Date(y, m-1, dd);
  const map = {};
  DAYS.forEach((d,i)=>{ const dt=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i); map[d]=isoDate(dt); });
  return map;
}

    if(r.lunch){ Object.values(r.lunch).forEach(l=>{ if(l.driver) set.add(l.driver.trim()); }); }

  DATA.relief.forEach(rel=>{

}
function getAssignedOn(dayLabel){
  const set = new Set();
  DATA.routes.forEach(r=>{
    const v = r.days ? r.days[dayLabel] : undefined;
    if(v && v!=="UNASSIGNED" && v!=="N/A") v.split('/').forEach(n=>set.add(n.trim()));
    if(r.shifts2 && r.shifts2[dayLabel]) r.shifts2[dayLabel].forEach(s=>{ if(s.driver && s.driver!=="UNASSIGNED" && s.driver!=="N/A") set.add(s.driver.trim()); });
    if(r.lunch && r.lunch[dayLabel] && r.lunch[dayLabel].driver) set.add(r.lunch[dayLabel].driver.trim());

function getWeeklyDemandHours(){
  let total = 0;
  DATA.routes.forEach(r=>{
    Object.keys(r.days).forEach(day=>{ if(r.days[day]!=="N/A") total += (toMin(r.end)-toMin(r.start))/60; });
    if(r.shifts2) Object.values(r.shifts2).forEach(arr=>arr.forEach(s=>{ if(s.driver!=="N/A") total += (toMin(s.end)-toMin(s.start))/60; }));
  });
  return total;
}
function getDriverHours(){
  const totals = {};
  DATA.relief.forEach(rel=>{
    const parts = rel.name.split('—'); const person = parts[parts.length-1].trim();
    if(person) totals[person] = totals[person] || 0;
  });
  DATA.routes.forEach(r=>{
    const shiftMin = toMin(r.end) - toMin(r.start);
    Object.keys(r.days).forEach(day=>{
      const val = r.days[day];
      if(!val || val==="UNASSIGNED" || val==="N/A") return;
      let mins = shiftMin;
      let lunchDriver = null;
      if(r.lunch && r.lunch[day]){
        mins -= 60;
        if(r.lunch[day].driver) lunchDriver = r.lunch[day].driver;
      }
      const names = val.split('/').map(s=>s.trim()).filter(Boolean);
      const share = mins / names.length;
      names.forEach(n=>{ totals[n] = (totals[n]||0) + share; });
      if(lunchDriver){ totals[lunchDriver] = (totals[lunchDriver]||0) + 60; }
    });
    if(r.shifts2){
      Object.keys(r.shifts2).forEach(day=>{
        r.shifts2[day].forEach(s=>{
          if(!s.driver || s.driver==="UNASSIGNED" || s.driver==="N/A") return;
          const mins = toMin(s.end) - toMin(s.start);
          const names = s.driver.split('/').map(x=>x.trim()).filter(Boolean);
          const share = mins / names.length;
          names.forEach(n=>{ totals[n] = (totals[n]||0) + share; });
        });
      });
    }
  });
  return Object.entries(totals).map(([name,min])=>({name, hours: min/60})).sort((a,b)=>b.hours-a.hours);
}
function getConcerns(){
  const list = [];
  DATA.routes.forEach(r=>{
    Object.keys(r.days).forEach(day=>{
      if(r.days[day] === "UNASSIGNED"){
        list.push({type:"Unassigned shift", day, detail:`${r.name} (${r.vehicle}) has no driver on ${day}.`,
          action:()=>{ currentDay=day; showView('schedule'); flashRoute(r.name, day); }});
      }
    });
    if(r.shifts2){
      Object.keys(r.shifts2).forEach(day=>{
        r.shifts2[day].forEach((s,si)=>{
          if(s.driver === "UNASSIGNED"){
            list.push({type:"Unassigned shift", day, detail:`${r.name} (${label(s.start)}–${label(s.end)}) has no driver on ${day}.`,
              action:()=>{ currentDay=day; showView('schedule'); flashRoute(r.name, day); }});
          }
        });
      });
    }
  });
  DATA.relief.forEach(rel=>{
    Object.keys(rel.days).forEach(day=>{
      if(rel.days[day] === false){
        list.push({type:"Relief gap", day, detail:`${rel.name} is not covered on ${day}.`,
          action:()=>{ currentDay=day; showView('schedule'); }});
      }
    });
  });
  getDriverHours().forEach(h=>{
    if(h.hours > OT_LIMIT){
      list.push({type:"Overtime", day:null, detail:`${h.name} is scheduled ${h.hours.toFixed(1)} hrs this week (over ${OT_LIMIT}).`,
        action:()=>{ showView('hours'); }});
    }
  });
  return list;
}

  makeSimpleTab('trips','Trips', currentView==='trips', false, ()=>showView('trips'));
  makeDropdown('recordsgroup','Records', false, ['lookup','callouts'].includes(currentView),
    [['lookup','Look Up'],['callouts','Call-Outs']]);
}
function toggleDropdown(groupId){
  const isOpen = document.getElementById('dropdown-'+groupId).style.display === 'block';
  closeAllDropdowns();
  if(!isOpen) document.getElementById('dropdown-'+groupId).style.display = 'block';
}
function closeAllDropdowns(){
  document.querySelectorAll('[id^="dropdown-"]').forEach(m=>m.style.display='none');
}
document.addEventListener('click', closeAllDropdowns);

function showView(view){
  currentView = view;
  if(view==='week' || view==='schedule' || view==='lunch') scheduleSubTab = (view==='week' || view==='lunch') ? view : currentDay;
  ['dashboard','schedule','week','lunch','hours','callouts','trips','staffing','workforce','lookup'].forEach(v=>{
    const viewEl = document.getElementById('view-'+v);
    if(viewEl) viewEl.style.display = (v===view) ? '' : 'none';
  });
  renderAll();
}
function renderAll(){
  buildTabs();
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='schedule') renderSchedule();
  else if(currentView==='week') renderWeek();
  else if(currentView==='lunch') renderLunch();
  else if(currentView==='hours') renderHours();
  else if(currentView==='callouts') renderCallouts();
  else if(currentView==='trips') renderTrips();
  else if(currentView==='staffing') renderStaffing();
  else if(currentView==='workforce') renderWorkforce();
  else if(currentView==='lookup') renderLookup();
  if(READ_ONLY) lockReadOnly();
}
function lockReadOnly(){
  // Look Up's search fields and Workforce's what-if calculator stay active — everything that mutates data gets locked.
  const saveBtn = document.getElementById('saveNowBtn');
  if(saveBtn) saveBtn.style.display = 'none';
  ['view-dashboard','view-week','view-lunch','view-schedule','view-hours','view-callouts','view-trips','view-staffing'].forEach(id=>{
    const container = document.getElementById(id);
    if(!container) return;
    container.querySelectorAll('select, input').forEach(el=>{ el.disabled = true; });
    container.querySelectorAll('.addbtn, .delbtn, .toggle').forEach(el=>{ el.style.display='none'; });
  });
}

// ---------- dashboard ----------
function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const concerns = getConcerns();
  const totalShifts = DATA.routes.reduce((n,r)=>n+Object.keys(r.days).length+(r.shifts2?Object.values(r.shifts2).reduce((m,arr)=>m+arr.length,0):0),0);
  const tripsThisWeek = DATA.trips.filter(t=>Object.values(WEEK).includes(t.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const recentCallouts = [...DATA.callouts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  el.innerHTML = '';

  const todayISODash = WEEK[getTodayLabel()];
  if(DATA.holidays[todayISODash]){
    const h = DATA.holidays[todayISODash];
    const holBanner = document.createElement('div'); holBanner.className='card';
    holBanner.style.background = '#FBF3E1'; holBanner.style.borderColor = '#C7973F';
    holBanner.innerHTML = `<h2 class="display" style="color:#4A1420;">Today is a marked ${h.type}${h.label? ' — '+h.label:''}</h2>
      <p style="font-size:12.5px;margin:0;color:#5a4a1f;">Only East WKND and West WKND are running today — see Daily Schedule to assign drivers. Full-time staff are paid today, part-time are not, and no lunch relief is needed.</p>`;
    el.appendChild(holBanner);
  }

  const stats = document.createElement('div'); stats.className='stat-grid';
  stats.innerHTML = `
    <div class="stat ${concerns.length? 'danger':'ok'}"><b>${concerns.length}</b><span>Area${concerns.length!==1?'s':''} of concern</span></div>
    <div class="stat info"><b>${DATA.routes.length}</b><span>Fixed routes tracked</span></div>
    <div class="stat info"><b>${totalShifts}</b><span>Total weekly shifts</span></div>
    <div class="stat ${tripsThisWeek.length?'info':'ok'}"><b>${tripsThisWeek.length}</b><span>Trip request${tripsThisWeek.length!==1?'s':''} this week</span></div>`;
  el.appendChild(stats);

  const liveCard = document.createElement('div'); liveCard.className='card';
  liveCard.innerHTML = `<h2 class="display">Live Ridership Today</h2><div class="empty">Loading from the driver log&hellip;</div>`;
  el.appendChild(liveCard);
  fetchLiveRidershipToday().then(byRouteKey=>{
    if(!byRouteKey){
      liveCard.innerHTML = `<h2 class="display">Live Ridership Today</h2><div class="empty">No live data yet today — either no trips logged, or the driver log connection isn't set up. Route hours elsewhere still use planning estimates.</div>`;
      return;
    }
    const SIMPLIFIED_ROUTE_KEYS = ["drake","bulldog","normal_hills","paratransit","paratransit_night"];
    const rows = Object.entries(DRIVER_APP_ROUTE_KEY).filter(([name,key])=>key && byRouteKey[key] && !SIMPLIFIED_ROUTE_KEYS.includes(key));
    if(rows.length===0){
      liveCard.innerHTML = `<h2 class="display">Live Ridership Today</h2><div class="empty">No trips logged yet today.</div>`;
      return;
    }
    liveCard.innerHTML = `<h2 class="display">Live Ridership Today</h2>` + rows.map(([name,key])=>{
      const b = byRouteKey[key];
      const total = b.going + b.coming;
      return `<div class="hrow${b.overflow?' over':''}"><span>${name}</span><span class="mono">${total} riders${b.leftBehind?` · <span style="color:var(--danger);font-weight:700;">${b.leftBehind} left behind</span>`:''}${b.overflow?' <span class="badge">OVERFLOW</span>':''}</span></div>`;
    }).join('') + `<p class="note" style="margin-top:8px;">From the BTS Driver Log, updated on page load. On-campus/EV routes (Drake, Bulldog, Normal Hills, Paratransit, Paratransit Night) report a single total-passenger count per shift instead of per-stop counts, and aren't reflected here yet.</p>`;
  });

  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2 class="display">Areas of concern</h2>`;
  if(concerns.length===0){
    const ok=document.createElement('div'); ok.className='empty'; ok.textContent='No unassigned shifts, relief gaps, or overtime right now.';
    card.appendChild(ok);
  } else {
    concerns.forEach(c=>{
      const row=document.createElement('div'); row.className='concern';
      row.innerHTML = `<div class="info"><b>${c.type}${c.day? ' — '+c.day:''}</b>${c.detail}</div>`;
      const btn=document.createElement('button'); btn.className='fixbtn'; btn.textContent='Fix now';
      btn.onclick = c.action;
      row.appendChild(btn); card.appendChild(row);
    });
  }
  el.appendChild(card);

  const split = document.createElement('div'); split.className='split';
  const tripsCard = document.createElement('div'); tripsCard.className='card';
  tripsCard.innerHTML = `<h2 class="display">Trip requests this week</h2>`;
  if(tripsThisWeek.length===0){
    tripsCard.innerHTML += `<div class="empty">No trips scheduled this week.</div>`;
  } else {
    tripsThisWeek.forEach(t=>{
      const div=document.createElement('div'); div.className='trip-item';
      div.innerHTML = `<b>${fmtDate(t.date)}</b> — ${t.pickup} → ${t.destination} <span style="color:${statusColor(t.status)};font-weight:700;">(${t.status})</span><br>${label(t.departure)}–${label(t.return)} · Driver(s): ${tripDriversLabel(t)}`;
      tripsCard.appendChild(div);
    });
  }
  split.appendChild(tripsCard);

  const coCard = document.createElement('div'); coCard.className='card';
  coCard.innerHTML = `<h2 class="display">Recent call-outs</h2>`;
  if(recentCallouts.length===0){
    coCard.innerHTML += `<div class="empty">No call-outs logged.</div>`;
  } else {
    recentCallouts.forEach(c=>{
      const div=document.createElement('div'); div.className='callout-item';
      div.innerHTML = `<b>${fmtDate(c.date)}</b> — ${c.driver} (${c.reason})${c.route? ' · '+c.route:''}`;
      coCard.appendChild(div);
    });
  }
  split.appendChild(coCard);
  el.appendChild(split);

  // ---- available drivers today (bottom of the dashboard) ----
  const today = new Date();
  const todayLabel = getTodayLabel();
  const todayISO = WEEK[todayLabel];
  const roster = getRoster();
  const allDrivers = [...roster.fullTime, ...roster.partTime];
  const assignedToday = getAssignedOn(todayLabel);
  const calledOutToday = new Set(DATA.callouts.filter(c=>c.date===todayISO).map(c=>c.driver));
  const isWeekend = (todayLabel==="Sat" || todayLabel==="Sun");
  const availableToday = allDrivers.filter(n=>{
    if(assignedToday.has(n)) return false;
    if(calledOutToday.has(n)) return false;
    const av = AVAILABILITY[n];
    if(av){
      if(av.weekendOnly && !isWeekend) return false;
      if(av.notFriday && todayLabel==="Fri") return false;
      if(av.weekdayOnly && isWeekend) return false;
    }
    return true;
  });

  const dateCard = document.createElement('div'); dateCard.className='card';
  dateCard.innerHTML = `<h2 class="display">Today — ${today.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'})}</h2>
    <p class="note">Drivers with no shift, lunch relief, or off-day relief duty scheduled today — a starting list to call if someone phones in sick. Anyone already called out today is left off this list. Availability windows are factored in; this still only reflects the master schedule, not anything outside it, so double-check before calling.</p>`;
  if(availableToday.length===0){
    dateCard.innerHTML += `<div class="empty">No one is available today given current shifts and availability windows.</div>`;
  } else {
    availableToday.forEach(n=>{
      const isFT = roster.fullTime.includes(n);
      const av = AVAILABILITY[n];
      const info = DATA.staffing[n];
      let note;
      if(isFT){ note = "Schedule off"; }
      else { note = av && av.after ? `Available after ${label(av.after)}` : "Available"; }
      const div=document.createElement('div'); div.className='hrow'; div.style.flexDirection='column'; div.style.alignItems='stretch';
      const showNote = !isFT && info && info.availability;
      const noteColor = isFT ? '#C7973F' : '#2F6E62';
      div.innerHTML = `<div style="display:flex;justify-content:space-between;"><span>${n}</span><span style="font-weight:600;color:${noteColor};">${note}</span></div>${showNote?`<span class="note">${info.availability}</span>`:''}`;
      dateCard.appendChild(div);
    });
  }
  el.appendChild(dateCard);
}


// ---------- schedule (single day) ----------
function openEditor(routeIdx, day, anchorEl){
  closeEditor();
  const r = DATA.routes[routeIdx];
  const rect = anchorEl.getBoundingClientRect();
  const overlay=document.createElement('div'); overlay.className='overlay'; overlay.id='editorOverlay'; overlay.onclick=closeEditor;
  document.body.appendChild(overlay);
  const box=document.createElement('div'); box.className='editor'; box.id='editorBox';
  box.style.top = Math.min(rect.bottom+8, window.innerHeight-160)+'px';
  box.style.left = Math.min(rect.left, window.innerWidth-280)+'px';
  const currentVal = r.days[day]==="UNASSIGNED" ? "" : r.days[day];
  box.innerHTML = `<label>${r.name} — ${day}</label>
    <select id="editorInput">${driverOptionsHTML(currentVal)}</select>
    <div class="btnrow"><button id="editorCancel">Cancel</button><button class="save" id="editorSave">Save</button></div>`;
  document.body.appendChild(box);
  const input=document.getElementById('editorInput'); input.focus();
  document.getElementById('editorCancel').onclick = closeEditor;
  document.getElementById('editorSave').onclick = ()=>{
    const val = input.value.trim();
    r.days[day] = val===""?"UNASSIGNED":val;
    closeEditor(); renderAll(); saveData();
  };
  input.addEventListener('keydown', e=>{ if(e.key==='Escape') closeEditor(); });
}
function closeEditor(){
  const b=document.getElementById('editorBox'); if(b)b.remove();
  const o=document.getElementById('editorOverlay'); if(o)o.remove();
}
function openShiftEditor(r, day, shiftIdx, anchorEl){
  closeEditor();
  const s = r.shifts2[day][shiftIdx];
  const rect = anchorEl.getBoundingClientRect();
  const overlay=document.createElement('div'); overlay.className='overlay'; overlay.id='editorOverlay'; overlay.onclick=closeEditor;
  document.body.appendChild(overlay);
  const box=document.createElement('div'); box.className='editor'; box.id='editorBox';
  box.style.top = Math.min(rect.bottom+8, window.innerHeight-160)+'px';
  box.style.left = Math.min(rect.left, window.innerWidth-280)+'px';

    <div class="btnrow"><button id="editorCancel">Cancel</button><button class="save" id="editorSave">Save</button></div>`;
  document.body.appendChild(box);
  const input=document.getElementById('editorInput'); input.focus();
  document.getElementById('editorCancel').onclick = closeEditor;
  document.getElementById('editorSave').onclick = ()=>{
    const val = input.value.trim();
    s.driver = val===""?"UNASSIGNED":val;
    closeEditor(); renderAll(); saveData();
  };
  input.addEventListener('keydown', e=>{ if(e.key==='Escape') closeEditor(); });
}

function routeActiveOn(r,d){ return (!!r.days[d] && r.days[d]!=="N/A") || !!(r.shifts2 && r.shifts2[d]); }
let scheduleSubTab = 'week';
function renderScheduleSubNav(activeKey){
  const wrap = document.createElement('div'); wrap.className='daytabs';
  const weekBtn = document.createElement('button');
  weekBtn.className = 'daytab' + (activeKey==='week' ? ' active':'');
  weekBtn.textContent = 'Week';
  weekBtn.onclick = ()=>{ scheduleSubTab='week'; showView('week'); };
  wrap.appendChild(weekBtn);
  const concernDays = new Set(getConcerns().map(c=>c.day));
  DAYS.forEach(d=>{
    const activeCount = DATA.routes.filter(r=>routeActiveOn(r,d)).length;
    const btn = document.createElement('button');
    btn.className = 'daytab' + (activeKey===d?' active':'') + (concernDays.has(d)?' hasgap':'');
    btn.innerHTML = `${d} <span class="mono" style="font-size:9px;opacity:.7;">${fmtDate(WEEK[d])}</span><span class="n">${activeCount} route${activeCount!==1?'s':''}</span>`;
    btn.onclick = ()=>{ scheduleSubTab=d; currentDay=d; showView('schedule'); };
    wrap.appendChild(btn);
  });
  const lunchGap = DATA.routes.some(r=>r.lunch && Object.values(r.lunch).some(l=>!l.driver));
  const lunchBtn = document.createElement('button');
  lunchBtn.className = 'daytab' + (activeKey==='lunch' ? ' active':'') + (lunchGap?' hasgap':'');
  lunchBtn.textContent = 'Lunch';
  lunchBtn.onclick = ()=>{ scheduleSubTab='lunch'; showView('lunch'); };
  wrap.appendChild(lunchBtn);
  return wrap;
}
function renderSchedule(){
  const el = document.getElementById('view-schedule');
  el.innerHTML = '';
  el.appendChild(renderScheduleSubNav(currentDay));
  const todayISOForDay = WEEK[currentDay];
  const holidayForDay = DATA.holidays[todayISOForDay];
  const dayTypeCard = document.createElement('div'); dayTypeCard.className='card';
  if(holidayForDay){
    dayTypeCard.style.background = '#FBF3E1'; dayTypeCard.style.borderColor = '#C7973F';
  }
  dayTypeCard.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <div style="flex:none;">
        <label style="font-size:10.5px;color:#8a7d76;display:block;margin-bottom:3px;">Day type</label>
        <select id="dayTypeSelect">
          <option value="" ${!holidayForDay?'selected':''}>Normal schedule</option>
          <option value="Holiday" ${holidayForDay&&holidayForDay.type==='Holiday'?'selected':''}>Holiday</option>
          <option value="Snow Day" ${holidayForDay&&holidayForDay.type==='Snow Day'?'selected':''}>Snow Day</option>
          <option value="No School" ${holidayForDay&&holidayForDay.type==='No School'?'selected':''}>No School</option>
          <option value="Other" ${holidayForDay&&holidayForDay.type==='Other'?'selected':''}>Other</option>
        </select>
      </div>
      <div style="flex:1;min-width:160px;${holidayForDay?'':'display:none;'}" id="dayTypeLabelWrap">
        <label style="font-size:10.5px;color:#8a7d76;display:block;margin-bottom:3px;">Label (optional)</label>
        <input type="text" id="dayTypeLabel" placeholder="e.g. Thanksgiving Break" value="${holidayForDay?(holidayForDay.label||''):''}">
      </div>
    </div>
    ${holidayForDay ? `<p style="font-size:12.5px;margin:10px 0 0;color:#5a4a1f;">Only East WKND and West WKND run on this date — normal weekday routes are hidden below, and no lunch relief is needed (drivers park for lunch on weekends and holidays).</p>` : ``}
  `;
  el.appendChild(dayTypeCard);
  document.getElementById('dayTypeSelect').onchange = (e)=>{
    const type = e.target.value;
    if(!type){
      delete DATA.holidays[todayISOForDay];
    } else {
      const existing = DATA.holidays[todayISOForDay];
      DATA.holidays[todayISOForDay] = {
        type,
        label: existing ? (existing.label||'') : '',
        assignments: existing ? existing.assignments : {"East WKND":"UNASSIGNED","West WKND":"UNASSIGNED"}
      };
    }
    saveData(); renderAll();
  };
  if(holidayForDay){
    document.getElementById('dayTypeLabel').onchange = (e)=>{
      DATA.holidays[todayISOForDay].label = e.target.value.trim();
      saveData();
    };
  }
  const tl = document.createElement('div'); tl.className='card'; tl.id='timeline';
  el.appendChild(tl);
  const split = document.createElement('div'); split.className='split';
  const reliefCard = document.createElement('div'); reliefCard.className='card';
  reliefCard.innerHTML = `<h2 class="display">Relief &amp; support staff</h2><div id="reliefBody"></div>`;
  const fleetCard = document.createElement('div'); fleetCard.className='card';
  fleetCard.innerHTML = `<h2 class="display">Fleet not tied to a fixed route</h2>
    <div><span class="fleet-chip">AL-3 — Spare (28-cap)</span><span class="fleet-chip">219 — Spare (22-cap)</span>
    <span class="fleet-chip">582 — Trips / charter (40-cap)</span><span class="fleet-chip">401 — Trips / charter (40-cap)</span></div>
    <p class="note">These 4 vehicles cover breakdowns, charters, and trips — not part of the daily fixed-route timeline.</p>`;
  split.appendChild(reliefCard); split.appendChild(fleetCard);
  el.appendChild(split);

  const day = currentDay;
  const weekendRoutes = DATA.routes.filter(r=>r.name==="East WKND" || r.name==="West WKND");
  const active = holidayForDay ? weekendRoutes : DATA.routes.filter(r=>routeActiveOn(r,day));
  const tripsToday = DATA.trips.filter(t=>t.date===WEEK[day]);
  const windowStart = Math.min(...active.map(r=>toMin(r.start)), toMin("7:00"), ...tripsToday.map(t=>toMin(t.departure)));
  const windowEnd = Math.max(...active.map(r=>toMin(r.end)), toMin("18:00"), ...tripsToday.map(t=>toMin(t.return)));
  const totalMin = windowEnd - windowStart;

  const timeline = document.getElementById('timeline');
  timeline.innerHTML = `<h2 class="display">${holidayForDay ? holidayForDay.type : (day==="Sat"||day==="Sun"?"Weekend":"Weekday")} timeline — ${day} (${fmtDate(WEEK[day])})</h2>`;
  const axis=document.createElement('div'); axis.className='axis';
  for(let h=Math.ceil(windowStart/60); h<=Math.floor(windowEnd/60); h+=2){
    const pos=((h*60-windowStart)/totalMin)*100;
    const s=document.createElement('span'); s.style.left=pos+'%'; s.textContent=label(`${h}:00`);
    axis.appendChild(s);
  }
  timeline.appendChild(axis);

  if(holidayForDay){
    const gl=document.createElement('div'); gl.className='grp-label'; gl.textContent='Weekend / Holiday'; timeline.appendChild(gl);
    weekendRoutes.forEach(r=>{
      const row=document.createElement('div'); row.className='row';
      const rlabel=document.createElement('div'); rlabel.className='rlabel';
      rlabel.innerHTML = `<b>${r.name}</b><span>${r.vehicle}</span>`;
      const track=document.createElement('div'); track.className='track';
      const seg=document.createElement('div'); seg.className='seg';
      const cur = holidayForDay.assignments[r.name];
      const left=((toMin(r.start)-windowStart)/totalMin)*100;
      const width=((toMin(r.end)-toMin(r.start))/totalMin)*100;
      seg.style.left=left+'%'; seg.style.width=width+'%';
      if(!cur || cur==="UNASSIGNED"){ seg.classList.add('gap'); seg.textContent="UNASSIGNED — assign in Holidays tab"; }
      else { seg.style.background=CAT_COLOR.Weekend; seg.textContent=cur; }
      track.appendChild(seg);
      row.appendChild(rlabel); row.appendChild(track);
      timeline.appendChild(row);
    });
    const legend=document.createElement('div'); legend.className='legend';
    legend.innerHTML = `<span><i style="background:${CAT_COLOR.Weekend}"></i>Weekend/Holiday</span><span><i style="background:#A63A2E"></i>Unassigned — needs coverage</span>`;
    timeline.appendChild(legend);
    const rb = document.getElementById('reliefBody');
    rb.innerHTML = '<div class="empty">Relief/support staff aren&#39;t used on a holiday or snow day.</div>';
    return;
  }

  const cats = ["On-Campus","Off-Campus","Night","Weekend"];
  let any=false;
  cats.forEach(cat=>{
    const rs = DATA.routes.map((r,i)=>({r,i})).filter(x=>x.r.cat===cat && routeActiveOn(x.r,day));
    if(rs.length===0) return;
    any=true;
    const gl=document.createElement('div'); gl.className='grp-label'; gl.textContent=cat; timeline.appendChild(gl);
    rs.forEach(({r,i})=>{
      if(r.shifts2 && r.shifts2[day]){
        r.shifts2[day].forEach((s,si)=>{
          const row=document.createElement('div'); row.className='row';
          const rlabel=document.createElement('div'); rlabel.className='rlabel';
          rlabel.innerHTML = `<b>${r.name} — ${si===0?'AM':'PM'}</b><span>${r.vehicle.split('/')[si] ? r.vehicle.split('/')[si].trim() : r.vehicle}</span>`;
          const track=document.createElement('div'); track.className='track';
          const seg=document.createElement('div'); seg.className='seg'+(r.cdl?' cdl':'');
          seg.setAttribute('data-route', r.name); seg.setAttribute('data-day', day);
          const left=((toMin(s.start)-windowStart)/totalMin)*100;
          const width=((toMin(s.end)-toMin(s.start))/totalMin)*100;
          seg.style.left=left+'%'; seg.style.width=width+'%';
          if(s.driver==="UNASSIGNED"){ seg.classList.add('gap'); seg.textContent="UNASSIGNED — click to assign"; }
          else { seg.style.background=CAT_COLOR[cat]; seg.textContent=s.driver; }
          seg.title = READ_ONLY ? "" : "Click to update this shift";
          if(!READ_ONLY) seg.onclick=()=>openShiftEditor(r, day, si, seg); else seg.style.cursor='default';
          track.appendChild(seg);
          row.appendChild(rlabel); row.appendChild(track);
          timeline.appendChild(row);
        });
        return;
      }
      const row=document.createElement('div'); row.className='row';
      const rlabel=document.createElement('div'); rlabel.className='rlabel';
      rlabel.innerHTML = `<b>${r.name}</b><span>${r.vehicle}</span>`;
      const track=document.createElement('div'); track.className='track';
      const seg=document.createElement('div'); seg.className='seg'+(r.cdl?' cdl':'');
      seg.setAttribute('data-route', r.name); seg.setAttribute('data-day', day);
      const left=((toMin(r.start)-windowStart)/totalMin)*100;
      const width=((toMin(r.end)-toMin(r.start))/totalMin)*100;
      seg.style.left=left+'%'; seg.style.width=width+'%';
      if(r.days[day]==="UNASSIGNED"){ seg.classList.add('gap'); seg.textContent="UNASSIGNED — click to assign"; }
      else { seg.style.background=CAT_COLOR[cat]; seg.textContent=r.days[day]; }
      seg.title = READ_ONLY ? "" : "Click to update this shift";
      if(!READ_ONLY) seg.onclick=()=>openEditor(i, day, seg); else seg.style.cursor='default';
      track.appendChild(seg);
      row.appendChild(rlabel); row.appendChild(track);
      timeline.appendChild(row);
      if(r.lunch && r.lunch[day]){
        const lrow=document.createElement('div'); lrow.className='row'; lrow.style.marginTop='-4px'; lrow.style.marginBottom='10px';
        const llabel=document.createElement('div'); llabel.className='rlabel'; llabel.innerHTML=`<span>&#8627; Lunch break</span>`;
        const lbox=document.createElement('div'); lbox.style.display='flex'; lbox.style.gap='8px'; lbox.style.alignItems='center';
        const timeInp=document.createElement('input'); timeInp.type='time'; timeInp.value=r.lunch[day].time;
        timeInp.style.cssText='padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:11.5px;width:100px;';
        const relInp=document.createElement('select'); relInp.innerHTML=driverOptionsHTML(r.lunch[day].driver);
        relInp.style.cssText='padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:11.5px;width:150px;';
        timeInp.onchange=()=>{ r.lunch[day].time=timeInp.value; saveData(); buildTabs(); };
        relInp.onchange=()=>{ r.lunch[day].driver=relInp.value.trim(); saveData(); renderAll(); };
        lbox.appendChild(timeInp); lbox.appendChild(relInp);
        lrow.appendChild(llabel); lrow.appendChild(lbox);
        timeline.appendChild(lrow);
      }
    });
  });
  if(tripsToday.length){
    any=true;
    const gl=document.createElement('div'); gl.className='grp-label'; gl.textContent='Trips'; timeline.appendChild(gl);
    tripsToday.forEach(t=>{
      const row=document.createElement('div'); row.className='row';
      const rlabel=document.createElement('div'); rlabel.className='rlabel';
      rlabel.innerHTML = `<b style="${t.status==='Cancelled'?'text-decoration:line-through;color:#8a7d76;':''}">${t.pickup} → ${t.destination}</b><span>${tripDriversLabel(t)} · <span style="color:${statusColor(t.status)};font-weight:700;">${t.status}</span></span>`;
      const track=document.createElement('div'); track.className='track';
      const seg=document.createElement('div'); seg.className='seg';
      const left=((toMin(t.departure)-windowStart)/totalMin)*100;
      const width=((toMin(t.return)-toMin(t.departure))/totalMin)*100;
      seg.style.left=left+'%'; seg.style.width=width+'%'; seg.style.background= t.status==='Cancelled' ? '#8a7d76' : CAT_COLOR.Trip;
      seg.textContent = `${label(t.departure)}–${label(t.return)}`;
      seg.title = "Update this in the Trip Requests tab";
      track.appendChild(seg);
      row.appendChild(rlabel); row.appendChild(track);
      timeline.appendChild(row);
    });
  }
  if(!any){ const e=document.createElement('div'); e.className='empty'; e.textContent='No fixed routes or trips scheduled this day.'; timeline.appendChild(e); }

  const gl2=document.createElement('div'); gl2.className='grp-label'; gl2.textContent='Optional (not currently running)'; timeline.appendChild(gl2);
  DATA.optional.forEach(o=>{
    const row=document.createElement('div'); row.className='row';
    const rlabel=document.createElement('div'); rlabel.className='rlabel';
    rlabel.innerHTML = `<b>${o.name}</b><span>${o.note}</span>`;
    const track=document.createElement('div'); track.className='track';
    const seg=document.createElement('div'); seg.className='seg ghost';
    const left=((toMin(o.start)-windowStart)/totalMin)*100;
    const width=((toMin(o.end)-toMin(o.start))/totalMin)*100;
    seg.style.left=Math.max(0,left)+'%'; seg.style.width=width+'%'; seg.textContent='Not staffed';
    track.appendChild(seg); row.appendChild(rlabel); row.appendChild(track);
    timeline.appendChild(row);
  });

  const legend=document.createElement('div'); legend.className='legend';
  legend.innerHTML = Object.keys(CAT_COLOR).map(k=>`<span><i style="background:${CAT_COLOR[k]}"></i>${k}</span>`).join('')
    + `<span><i style="background:repeating-linear-gradient(45deg,#C7973F,#C7973F 3px,#F7EFDD 3px,#F7EFDD 6px)"></i>Optional / not running</span>`
    + `<span><i style="background:#A63A2E"></i>Unassigned — needs coverage</span>`
    + `<span>CDL badge = route requires a CDL driver</span>`;
  timeline.appendChild(legend);

  const rb = document.getElementById('reliefBody');
  const onToday = DATA.relief.filter(x=>x.days[day]!==undefined);
  if(onToday.length===0){ rb.innerHTML='<div class="empty">No relief/support data for this day.</div>'; }
  else {
    onToday.forEach(x=>{
      const on = x.days[day];
      const div=document.createElement('div'); div.className='relief-item';
      const span=document.createElement('span'); span.textContent=x.name;
      const btn=document.createElement('button'); btn.className='toggle';
      btn.textContent = on?'On duty':'Not covered'; btn.style.color = on?'#2F6E62':'#A63A2E';
      btn.onclick=()=>{ x.days[day]=!x.days[day]; renderAll(); saveData(); };
      div.appendChild(span); div.appendChild(btn); rb.appendChild(div);
    });
  }
}

// ---------- week schedule (grid editor) ----------
function addDaysISO(iso, n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d+n); return isoDate(dt); }
function getPlannedValue(weekStartISO, route, day, shiftIdx){
  const ov = DATA.weekOverrides[weekStartISO] && DATA.weekOverrides[weekStartISO][route.name] && DATA.weekOverrides[weekStartISO][route.name][day];
  if(ov !== undefined) return shiftIdx!==undefined ? ov[shiftIdx] : ov;
  return shiftIdx!==undefined ? route.shifts2[day][shiftIdx].driver : route.days[day];
}
function setPlannedValue(weekStartISO, route, day, val, shiftIdx){
  if(!DATA.weekOverrides[weekStartISO]) DATA.weekOverrides[weekStartISO] = {};
  if(!DATA.weekOverrides[weekStartISO][route.name]) DATA.weekOverrides[weekStartISO][route.name] = {};
  if(shiftIdx!==undefined){
    const existing = DATA.weekOverrides[weekStartISO][route.name][day] || route.shifts2[day].map(s=>s.driver);
    existing[shiftIdx] = val;
    DATA.weekOverrides[weekStartISO][route.name][day] = existing;
  } else {
    DATA.weekOverrides[weekStartISO][route.name][day] = val;
  }
}
function getPlannedHoliday(weekStartISO, dateISO){
  return DATA.weekOverrides[weekStartISO] && DATA.weekOverrides[weekStartISO].__holidays && DATA.weekOverrides[weekStartISO].__holidays[dateISO];
}
function togglePlannedHoliday(weekStartISO, dateISO){
  if(!DATA.weekOverrides[weekStartISO]) DATA.weekOverrides[weekStartISO] = {};
  if(!DATA.weekOverrides[weekStartISO].__holidays) DATA.weekOverrides[weekStartISO].__holidays = {};
  if(DATA.weekOverrides[weekStartISO].__holidays[dateISO]){
    delete DATA.weekOverrides[weekStartISO].__holidays[dateISO];
  } else {
    DATA.weekOverrides[weekStartISO].__holidays[dateISO] = {type:"No School", label:"", assignments:{"East WKND":"UNASSIGNED","West WKND":"UNASSIGNED"}};
  }
}
let planSelectedMonday = null;

function renderLunch(){
  const el = document.getElementById('view-lunch');
  el.innerHTML = '';
  el.appendChild(renderScheduleSubNav('lunch'));
  const lunchRoutes = DATA.routes.filter(r=>r.lunch && Object.keys(r.lunch).length);
  const gridCard = document.createElement('div'); gridCard.className='card';
  gridCard.innerHTML = `<h2 class="display">Lunch schedule</h2>
    <p class="note">Every route running more than 8 hours gets a 1-hour lunch break. This consolidates what's set per-day in the Schedule tab into one editable view. Leave the relief driver blank to mark it unassigned — it'll show in red here and on that driver's app. Use "Set whole week" on the right to fill every day at once instead of one cell at a time.</p>
    <table class="grid" id="lunchGrid"></table>`;
  el.appendChild(gridCard);
  const table = document.getElementById('lunchGrid');
  if(lunchRoutes.length===0){
    table.outerHTML = '<div class="empty">No routes currently require a lunch break.</div>';
    return;
  }
  const lunchDays = ["Mon","Tue","Wed","Thu","Fri"];
  let html = '<tr><th>Route</th>' + lunchDays.map(d=>`<th>${d}<br><span style="font-weight:400;">${fmtDate(WEEK[d])}</span></th>`).join('') + '<th>Set whole week</th></tr>';
  lunchRoutes.forEach((r)=>{
    const ri = DATA.routes.indexOf(r);
    html += `<tr><td><b>${r.name}</b><br><span class="note">${r.vehicle}</span></td>`;
    lunchDays.forEach(d=>{
      if(!r.lunch[d]){ html += `<td class="muted">—</td>`; return; }
      const time = r.lunch[d].time || "12:00";
      const driver = r.lunch[d].driver || "";
      html += `<td>
        <input type="time" data-ri="${ri}" data-day="${d}" data-field="time" value="${time}" style="margin-bottom:4px;">
        <select data-ri="${ri}" data-day="${d}" data-field="driver" style="${!driver?'border-color:var(--danger);color:var(--danger);':''}">${driverOptionsHTML(driver)}</select>
      </td>`;
    });
    html += `<td>
      <input type="time" id="bulkLunchTime-${ri}" value="12:00" style="margin-bottom:4px;">
      <select id="bulkLunchDriver-${ri}" style="margin-bottom:4px;">${driverOptionsHTML('')}</select>
      <button class="addbtn" data-bulk-lunch="${ri}" style="width:100%;padding:5px 0;font-size:10.5px;">Apply</button>
    </td>`;
    html += '</tr>';
  });
  table.innerHTML = html;
  table.querySelectorAll('[data-bulk-lunch]').forEach(btn=>{
    btn.onclick = ()=>{
      const ri = parseInt(btn.dataset.bulkLunch);
      const r = DATA.routes[ri];
      const time = document.getElementById('bulkLunchTime-'+ri).value || "12:00";
      const driver = document.getElementById('bulkLunchDriver-'+ri).value.trim();
      Object.keys(r.lunch).forEach(d=>{ r.lunch[d] = {time, driver}; });
      saveData();
      renderLunch();
    };
  });
  table.querySelectorAll('input, select').forEach(inp=>{
    if(inp.id && (inp.id.startsWith('bulkLunchTime-') || inp.id.startsWith('bulkLunchDriver-'))) return;
    inp.onchange = ()=>{
      const ri = parseInt(inp.dataset.ri), d = inp.dataset.day, field = inp.dataset.field;
      const route = DATA.routes[ri];
      if(field==='time'){ route.lunch[d].time = inp.value; }
      else { route.lunch[d].driver = inp.value.trim(); }
      saveData();
      renderAll();
    };
  });
}

function renderWeek(){
  const el = document.getElementById('view-week');
  el.innerHTML = '';
  el.appendChild(renderScheduleSubNav('week'));
  const gridCard = document.createElement('div'); gridCard.className='card';
  gridCard.innerHTML = `<h2 class="display">Week schedule</h2>
    <p class="note">Changes here update the Dashboard and Schedule tabs immediately. Choose "— Unassigned —" to mark a shift open. Cells for days a route doesn't normally run are shown as "—". Use "Set whole week" on the right to fill every day at once instead of one cell at a time. Toggle "No School" under a date to switch that day to East WKND/West WKND only.</p>
    <table class="grid" id="weekGrid"></table>`;
  el.appendChild(gridCard);
  const table = document.getElementById('weekGrid');
  let html = '<tr><th>Route</th>' + DAYS.map(d=>{
    const dateISO = WEEK[d];
    const isWeekday = ["Mon","Tue","Wed","Thu","Fri"].includes(d);
    const marked = !!DATA.holidays[dateISO];
    const toggleHtml = isWeekday ? `
      <div class="ns-toggle-row" data-ns-toggle="${d}">
        <div class="ns-switch${marked?' on':''}"><div class="ns-knob"></div></div>
        <span class="ns-toggle-label">No School</span>
      </div>` : ``;
    return `<th class="${marked?'ns-on':''}">${d}<br><span style="font-weight:400;">${fmtDate(dateISO)}</span>${toggleHtml}</th>`;
  }).join('') + '<th>Set whole week</th></tr>';
  DATA.routes.forEach((r,ri)=>{
    html += `<tr><td><b>${r.name}</b><br><span class="note">${r.vehicle}</span></td>`;
    DAYS.forEach(d=>{
      const dateISO = WEEK[d];
      const holiday = DATA.holidays[dateISO];
      const isWeekendRoute = (r.name==="East WKND" || r.name==="West WKND");
      if(holiday){
        if(isWeekendRoute){
          const cur = holiday.assignments[r.name];
          const val = (!cur || cur==="UNASSIGNED") ? "" : cur;
          html += `<td><select data-holiday-date="${dateISO}" data-holiday-route="${r.name}" style="${!val?'border-color:var(--danger);color:var(--danger);':''}">${driverOptionsHTML(val)}</select></td>`;
        } else {
          html += `<td class="ns-cell">— ${holiday.type} —</td>`;
        }
        return;
      }
      if(r.shifts2 && r.shifts2[d]){
        html += `<td>` + r.shifts2[d].map((s,si)=>{
          const val = s.driver==="UNASSIGNED" ? "" : s.driver;
          return `<select data-ri="${ri}" data-day="${d}" data-shift="${si}" style="margin-bottom:3px;">${driverOptionsHTML(val)}</select>`;
        }).join('') + `</td>`;
      } else if(r.days[d]===undefined){ html += `<td class="muted">—</td>`; }
      else {
        const val = r.days[d]==="UNASSIGNED" ? "" : r.days[d];
        html += `<td><select data-ri="${ri}" data-day="${d}">${driverOptionsHTML(val)}</select></td>`;
      }
    });
    html += `<td>
      <select id="bulkWeek-${ri}" style="margin-bottom:4px;">${driverOptionsHTML('')}</select>
      <button class="addbtn" data-bulk-week="${ri}" style="width:100%;padding:5px 0;font-size:10.5px;">Apply</button>
    </td>`;
    html += '</tr>';
  });
  html += `<tr><td><b>Trips</b><br><span class="note">from Trip Requests tab</span></td>` + DAYS.map(d=>{
    const trips = DATA.trips.filter(t=>t.date===WEEK[d]);
    if(trips.length===0) return `<td class="muted">—</td>`;
    return `<td>${trips.map(t=>`<span style="color:${statusColor(t.status)};font-weight:700;">●</span> ${t.pickup}→${t.destination}<br><span class="note">${label(t.departure)}–${label(t.return)} · ${t.status}</span>`).join('<hr style="border:none;border-top:1px solid var(--line);margin:4px 0;">')}</td>`;
  }).join('') + `<td></td></tr>`;
  table.innerHTML = html;

  table.querySelectorAll('[data-ns-toggle]').forEach(row=>{
    row.onclick = ()=>{
      const d = row.dataset.nsToggle;
      const dateISO = WEEK[d];
      if(DATA.holidays[dateISO]){
        delete DATA.holidays[dateISO];
      } else {
        DATA.holidays[dateISO] = {type:"No School", label:"", assignments:{"East WKND":"UNASSIGNED","West WKND":"UNASSIGNED"}};
      }
      saveData();
      renderWeek();
    };
  });
  table.querySelectorAll('[data-holiday-date]').forEach(sel=>{
    sel.onchange = ()=>{
      const dateISO = sel.dataset.holidayDate, routeName = sel.dataset.holidayRoute;
      const val = sel.value.trim();
      DATA.holidays[dateISO].assignments[routeName] = val===""?"UNASSIGNED":val;
      saveData();
      renderAll();
    };
  });
  table.querySelectorAll('[data-bulk-week]').forEach(btn=>{
    btn.onclick = ()=>{
      const ri = parseInt(btn.dataset.bulkWeek);
      const r = DATA.routes[ri];
      const sel = document.getElementById('bulkWeek-'+ri);
      const val = sel.value.trim();
      const finalVal = val===""?"UNASSIGNED":val;
      Object.keys(r.days).forEach(d=>{ r.days[d] = finalVal; });
      if(r.shifts2){
        Object.keys(r.shifts2).forEach(d=>{ r.shifts2[d].forEach(s=>{ s.driver = finalVal; }); });
      }
      saveData();
      renderWeek();
    };
  });
  table.querySelectorAll('select').forEach(inp=>{
    if(inp.id && inp.id.startsWith('bulkWeek-')) return;
    if(inp.dataset.holidayDate !== undefined) return;
    inp.onchange = ()=>{
      const ri = parseInt(inp.dataset.ri), d = inp.dataset.day;
      const val = inp.value.trim();
      if(inp.dataset.shift !== undefined && inp.dataset.shift !== ""){
        DATA.routes[ri].shifts2[d][parseInt(inp.dataset.shift)].driver = val===""?"UNASSIGNED":val;
      } else {
        DATA.routes[ri].days[d] = val===""?"UNASSIGNED":val;
      }
      saveData();
      buildTabs(); // refresh alert dots without full re-render (keeps focus stable)
    };
  });

  const tripsThisWeek = DATA.trips.filter(t=>Object.values(WEEK).includes(t.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const tCard = document.createElement('div'); tCard.className='card';
  tCard.innerHTML = `<h2 class="display">This week's trip requests</h2>`;
  if(tripsThisWeek.length===0){ tCard.innerHTML += `<div class="empty">None — add trips in the Trip Requests tab.</div>`; }
  else{
    tripsThisWeek.forEach(t=>{
      const div=document.createElement('div'); div.className='trip-item';
      div.innerHTML = `<b>${fmtDate(t.date)}</b> — ${t.pickup} → ${t.destination} · ${label(t.departure)}–${label(t.return)} · ${tripDriversLabel(t)}`;
      tCard.appendChild(div);
    });
  }
  el.appendChild(tCard);

  // ---- plan a future week ----
  if(!planSelectedMonday) planSelectedMonday = addDaysISO(WEEK.Mon, 7);
  const planCard = document.createElement('div'); planCard.className='card';
  planCard.innerHTML = `<h2 class="display">Plan a future week</h2>
    <p class="note">Pick any date in the week you want to plan and click "Load week." Changes here are staged separately — they won't touch the live schedule until you click "Apply this plan," so it's safe to try out a vacation swap and see if any gaps show up first.</p>
    <div class="form-row" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:14px;">
      <div><label>Any date in the week to plan</label><input type="date" id="planDatePicker" value="${planSelectedMonday}"></div>
      <div><button class="addbtn" id="planLoadWeek">Load week</button></div>
      <div><button class="addbtn" id="planApply">Apply this plan to the live schedule</button></div>
    </div>
    <table class="grid" id="planGrid"></table>
    <div id="planConcerns" style="margin-top:14px;"></div>`;
  el.appendChild(planCard);

  function loadPlanWeek(){
    const raw = document.getElementById('planDatePicker').value;
    if(!raw) return; // guard against a momentarily-empty value from the native date picker
    const parsed = mondayISOFrom(raw);
    if(parsed.includes('NaN')) return; // guard against an unparseable value
    planSelectedMonday = parsed;
    renderWeek();
  }
  document.getElementById('planDatePicker').onchange = loadPlanWeek;
  document.getElementById('planLoadWeek').onclick = loadPlanWeek;

  const planWeek = weekDatesFromMonday(planSelectedMonday);
  const planTable = document.getElementById('planGrid');
  let phtml = '<tr><th>Route</th>' + DAYS.map(d=>{
    const dateISO = planWeek[d];
    const isWeekday = ["Mon","Tue","Wed","Thu","Fri"].includes(d);
    const marked = !!getPlannedHoliday(planSelectedMonday, dateISO);
    const toggleHtml = isWeekday ? `
      <div class="ns-toggle-row" data-plan-ns-toggle="${d}">
        <div class="ns-switch${marked?' on':''}"><div class="ns-knob"></div></div>
        <span class="ns-toggle-label">No School</span>
      </div>` : ``;
    return `<th class="${marked?'ns-on':''}">${d}<br><span style="font-weight:400;">${fmtDate(dateISO)}</span>${toggleHtml}</th>`;
  }).join('') + '<th>Set whole week</th></tr>';
  DATA.routes.forEach((r,ri)=>{
    phtml += `<tr><td><b>${r.name}</b><br><span class="note">${r.vehicle}</span></td>`;
    DAYS.forEach(d=>{
      const dateISO = planWeek[d];
      const holiday = getPlannedHoliday(planSelectedMonday, dateISO);
      const isWeekendRoute = (r.name==="East WKND" || r.name==="West WKND");
      if(holiday){
        if(isWeekendRoute){
          const cur = holiday.assignments[r.name];
          const val = (!cur || cur==="UNASSIGNED") ? "" : cur;
          phtml += `<td><select data-plan-holiday-date="${dateISO}" data-plan-holiday-route="${r.name}" style="${!val?'border-color:var(--danger);color:var(--danger);':''}">${driverOptionsHTML(val)}</select></td>`;
        } else {
          phtml += `<td class="ns-cell">— ${holiday.type} —</td>`;
        }
        return;
      }
      if(r.shifts2 && r.shifts2[d]){
        phtml += `<td>` + r.shifts2[d].map((s,si)=>{
          const val = getPlannedValue(planSelectedMonday, r, d, si);
          const shown = val==="UNASSIGNED" ? "" : val;
          const isOverride = DATA.weekOverrides[planSelectedMonday] && DATA.weekOverrides[planSelectedMonday][r.name] && DATA.weekOverrides[planSelectedMonday][r.name][d] !== undefined;
          return `<select data-ri="${ri}" data-day="${d}" data-shift="${si}" style="margin-bottom:3px;${isOverride?'border-color:#C7973F;border-width:2px;':''}">${driverOptionsHTML(shown)}</select>`;
        }).join('') + `</td>`;
      } else if(r.days[d]===undefined){ phtml += `<td class="muted">—</td>`; }
      else {
        const val = getPlannedValue(planSelectedMonday, r, d);
        const shown = val==="UNASSIGNED" ? "" : val;
        const isOverride = DATA.weekOverrides[planSelectedMonday] && DATA.weekOverrides[planSelectedMonday][r.name] && DATA.weekOverrides[planSelectedMonday][r.name][d] !== undefined;
        phtml += `<td><select data-ri="${ri}" data-day="${d}" style="${isOverride?'border-color:#C7973F;border-width:2px;':''}">${driverOptionsHTML(shown)}</select></td>`;
      }
    });
    phtml += `<td>
      <select id="bulkPlan-${ri}" style="margin-bottom:4px;">${driverOptionsHTML('')}</select>
      <button class="addbtn" data-bulk-plan="${ri}" style="width:100%;padding:5px 0;font-size:10.5px;">Apply</button>
    </td>`;
    phtml += '</tr>';
  });
  planTable.innerHTML = phtml;

  planTable.querySelectorAll('[data-plan-ns-toggle]').forEach(row=>{
    row.onclick = ()=>{
      const d = row.dataset.planNsToggle;
      togglePlannedHoliday(planSelectedMonday, planWeek[d]);
      saveData();
      renderWeek();
    };
  });
  planTable.querySelectorAll('[data-plan-holiday-date]').forEach(sel=>{
    sel.onchange = ()=>{
      const dateISO = sel.dataset.planHolidayDate, routeName = sel.dataset.planHolidayRoute;
      const val = sel.value.trim();
      DATA.weekOverrides[planSelectedMonday].__holidays[dateISO].assignments[routeName] = val===""?"UNASSIGNED":val;
      saveData();
      renderWeek();
    };
  });
  planTable.querySelectorAll('[data-bulk-plan]').forEach(btn=>{
    btn.onclick = ()=>{
      const ri = parseInt(btn.dataset.bulkPlan);
      const r = DATA.routes[ri];
      const sel = document.getElementById('bulkPlan-'+ri);
      const val = sel.value.trim();
      const finalVal = val===""?"UNASSIGNED":val;
      Object.keys(r.days).forEach(d=>{ setPlannedValue(planSelectedMonday, r, d, finalVal); });
      if(r.shifts2){
        Object.keys(r.shifts2).forEach(d=>{
          r.shifts2[d].forEach((s,si)=>{ setPlannedValue(planSelectedMonday, r, d, finalVal, si); });
        });
      }
      saveData();
      renderWeek();
    };
  });
  planTable.querySelectorAll('select').forEach(inp=>{
    if(inp.id && inp.id.startsWith('bulkPlan-')) return;
    if(inp.dataset.planHolidayDate !== undefined) return;
    inp.onchange = ()=>{
      const ri = parseInt(inp.dataset.ri), d = inp.dataset.day;
      const r = DATA.routes[ri];
      const val = inp.value.trim();
      const finalVal = val===""?"UNASSIGNED":val;
      if(inp.dataset.shift !== undefined && inp.dataset.shift !== ""){
        setPlannedValue(planSelectedMonday, r, d, finalVal, parseInt(inp.dataset.shift));
      } else {
        setPlannedValue(planSelectedMonday, r, d, finalVal);
      }
      saveData();
      renderWeek();
    };
  });

  const planConcernsEl = document.getElementById('planConcerns');
  const gaps = [];
  DATA.routes.forEach(r=>{
    Object.keys(r.days).forEach(d=>{
      if(getPlannedHoliday(planSelectedMonday, planWeek[d])) return; // no-school days don't need this route covered
      if(getPlannedValue(planSelectedMonday, r, d) === "UNASSIGNED") gaps.push(`${r.name} — ${d} (${fmtDate(planWeek[d])})`);
    });
    if(r.shifts2) Object.keys(r.shifts2).forEach(d=>{
      if(getPlannedHoliday(planSelectedMonday, planWeek[d])) return;
      r.shifts2[d].forEach((s,si)=>{ if(getPlannedValue(planSelectedMonday, r, d, si)==="UNASSIGNED") gaps.push(`${r.name} (${si===0?'AM':'PM'}) — ${d} (${fmtDate(planWeek[d])})`); });
    });
  });
  if(gaps.length===0){
    planConcernsEl.innerHTML = `<div class="ok-banner" style="border:1px solid #BFD8CE;background:#EEF6F1;border-radius:6px;padding:10px 16px;font-size:12.5px;color:#2F6E62;">This plan has no open shifts for the week of ${fmtDate(planWeek.Mon)}.</div>`;
  } else {
    planConcernsEl.innerHTML = `<div class="conflicts"><h3 class="display">${gaps.length} open shift${gaps.length!==1?'s':''} in this plan</h3><ul>${gaps.map(g=>`<li>${g}</li>`).join('')}</ul></div>`;
  }

  document.getElementById('planApply').onclick = ()=>{
    const overrides = DATA.weekOverrides[planSelectedMonday];
    if(overrides){
      Object.keys(overrides).forEach(routeName=>{
        if(routeName === '__holidays') return;
        const r = DATA.routes.find(x=>x.name===routeName);
        if(!r) return;
        Object.keys(overrides[routeName]).forEach(d=>{
          const val = overrides[routeName][d];
          if(r.shifts2 && r.shifts2[d]){
            r.shifts2[d].forEach((s,si)=>{ s.driver = val[si]; });
          } else if(r.days[d]!==undefined){
            r.days[d] = val;
          }
        });
      });
      if(overrides.__holidays){
        Object.keys(overrides.__holidays).forEach(dateISO=>{
          DATA.holidays[dateISO] = overrides.__holidays[dateISO];
        });
      }
      delete DATA.weekOverrides[planSelectedMonday];
    }
    saveData(); renderAll();
  };
}

// ---------- workforce ----------
function parseStatedRangeCap(text){
  if(!text) return null;
  const m = text.match(/(\d+)\s*[–-]\s*(\d+)\s*hours?/i);
  return m ? parseInt(m[2]) : null;
}
function renderWorkforce(){
  const el = document.getElementById('view-workforce');
  const demand = getWeeklyDemandHours();
  const hoursByName = {};
  getDriverHours().forEach(h=>{ hoursByName[h.name] = h.hours; });
  const assigned = Object.values(hoursByName).reduce((s,h)=>s+h,0);
  const gap = Math.max(0, demand - assigned);
  const roster = getRoster();

  el.innerHTML = '';
  const stats = document.createElement('div'); stats.className='stat-grid';
  stats.innerHTML = `
    <div class="stat info"><b>${demand.toFixed(1)}</b><span>Hours needed to run every route, fully staffed</span></div>
    <div class="stat info"><b>${assigned.toFixed(1)}</b><span>Hours currently covered by assigned drivers</span></div>
    <div class="stat ${gap>0?'danger':'ok'}"><b>${gap.toFixed(1)}</b><span>Weekly hours still uncovered</span></div>`;
  el.appendChild(stats);

  if(gap>0){
    const gapCard = document.createElement('div'); gapCard.className='card';
    gapCard.innerHTML = `<h2 class="display">Where the gap is</h2>`;
    getConcerns().filter(c=>c.type==="Unassigned shift").forEach(c=>{
      const row=document.createElement('div'); row.className='concern';
      row.innerHTML = `<div class="info"><b>${c.day}</b>${c.detail}</div>`;
      gapCard.appendChild(row);
    });
    el.appendChild(gapCard);
  }

  // Full-time headroom
  const ftCard = document.createElement('div'); ftCard.className='card';
  ftCard.innerHTML = `<h2 class="display">Full-time headroom (before 40 hrs/week)</h2>`;
  let ftHeadroomTotal = 0;
  roster.fullTime.forEach(n=>{
    const cur = hoursByName[n] || 0;
    const headroom = Math.max(0, OT_LIMIT - cur);
    ftHeadroomTotal += headroom;
    const row=document.createElement('div'); row.className='hrow';
    row.innerHTML = `<span>${n}</span><span class="mono">${cur.toFixed(1)} hrs assigned <span style="color:#8a7d76;">(+${headroom.toFixed(1)} hrs headroom)</span></span>`;
    ftCard.appendChild(row);
  });
  el.appendChild(ftCard);

  // Part-time headroom (where a numeric range was given) + qualitative notes
  const ptCard = document.createElement('div'); ptCard.className='card';
  ptCard.innerHTML = `<h2 class="display">Part-time capacity</h2>
    <p class="note">Where availability includes a clear hour range (e.g. "20–25 hours/week"), headroom is calculated against the upper bound. Everything else is shown as-is for your own judgment — day/time-window limits and "X days a week" style constraints aren't reduced to a number.</p>`;
  let ptHeadroomTotal = 0;
  roster.partTime.forEach(n=>{
    const cur = hoursByName[n] || 0;
    const info = DATA.staffing[n];
    const cap = parseStatedRangeCap(info && info.availability);
    const row=document.createElement('div'); row.className='hrow'; row.style.flexDirection='column'; row.style.alignItems='stretch';
    let right;
    if(cap!==null){
      const headroom = Math.max(0, cap-cur);
      ptHeadroomTotal += headroom;
      right = `${cur.toFixed(1)} hrs assigned <span style="color:#8a7d76;">(+${headroom.toFixed(1)} hrs headroom vs. stated ${cap})</span>`;
    } else {
      right = `${cur.toFixed(1)} hrs assigned`;
    }
    row.innerHTML = `<div style="display:flex;justify-content:space-between;"><span>${n}</span><span class="mono">${right}</span></div><span class="note">${(info&&info.availability)||''}</span>`;
    ptCard.appendChild(row);
  });
  el.appendChild(ptCard);

  // What-if capacity calculator
  const calcCard = document.createElement('div'); calcCard.className='card';
  const totalHeadroom = ftHeadroomTotal + ptHeadroomTotal;
  calcCard.innerHTML = `<h2 class="display">Could we take on another route?</h2>
    <p class="note">Estimated spare capacity right now: <b>${totalHeadroom.toFixed(1)} hrs/week</b> (full-time headroom below 40 hrs, plus part-time headroom where a clear hour range was given — this excludes anyone whose limit is described only in days or a time window, so treat it as a floor, not a ceiling).</p>
    <div class="form-row" style="grid-template-columns:1fr 1fr;">
      <div><label>Weekly hours the new route would need</label><input type="number" id="wfNewRouteHours" min="0" step="0.5" placeholder="e.g. 20"></div>
      <div><button class="addbtn" id="wfCheck">Check</button></div>
    </div>
    <div id="wfCheckResult"></div>`;
  el.appendChild(calcCard);
  document.getElementById('wfCheck').onclick = ()=>{
    const need = parseFloat(document.getElementById('wfNewRouteHours').value);
    const resultEl = document.getElementById('wfCheckResult');
    if(isNaN(need)){ resultEl.innerHTML=''; return; }
    if(need <= totalHeadroom){
      resultEl.innerHTML = `<div class="ok-banner" style="border:1px solid #BFD8CE;background:#EEF6F1;border-radius:6px;padding:10px 16px;font-size:12.5px;color:#2F6E62;">Looks feasible on paper — ${need.toFixed(1)} hrs is within the ${totalHeadroom.toFixed(1)} hrs of estimated headroom. Still worth checking that the right people are trained and available for when the route actually runs.</div>`;
    } else {
      resultEl.innerHTML = `<div class="conflicts"><h3 class="display">Short by ${(need-totalHeadroom).toFixed(1)} hrs/week</h3><p style="font-size:12.5px;margin:0;">Current headroom (${totalHeadroom.toFixed(1)} hrs) doesn't cover a ${need.toFixed(1)}-hr/week route without new hires or schedule changes.</p></div>`;
    }
  };

  renderHolidayPaySummary(el);
}

    }
    if(callsThatDay.length){
      html += `<div class="grp-label">Call-outs that day</div>`;
      html += callsThatDay.map(c=>
        `<div class="callout-item">${c.driver} (${c.reason})${c.time? ' · '+label(c.time):''}${c.route? ' · '+c.route:''}${c.replacement? ' · replaced by '+c.replacement:''}${c.notes? ' · '+c.notes:''}</div>`
      ).join('');
    }
    res.innerHTML = html;
  };
  document.getElementById('luDriverGo').onclick = ()=>{
    const name = document.getElementById('luDriver').value.trim();
    const res = document.getElementById('luDriverResults');
    if(!name){ res.innerHTML = '<div class="empty">Enter a name to search.</div>'; return; }
    const dates = DATA.history ? Object.keys(DATA.history).filter(d=>
      Object.values(DATA.history[d]).some(v=> v && v.split('/').map(s=>s.trim()).includes(name))
    ).sort() : [];
    const calls = DATA.callouts.filter(c=>c.driver===name || c.replacement===name);
    let html = '';
    if(dates.length===0 && calls.length===0){
      html = '<div class="empty">No recorded shifts or call-outs for that name yet.</div>';
    } else {
      if(dates.length){
        html += dates.map(d=>{
          const routes = Object.entries(DATA.history[d]).filter(([r,v])=>v && v.split('/').map(s=>s.trim()).includes(name)).map(([r])=>r);
          return `<div class="hrow"><span>${fmtDate(d)}</span><span>${routes.join(', ')}</span></div>`;
        }).join('');
      }
      if(calls.length){
        html += `<div class="grp-label">Call-out history</div>`;
        html += calls.sort((a,b)=>b.date.localeCompare(a.date)).map(c=>
          `<div class="callout-item">${fmtDate(c.date)} — ${c.driver===name? 'Called out':'Covered for '+c.driver} (${c.reason})${c.time? ' · '+label(c.time):''}${c.replacement && c.driver===name? ' · replaced by '+c.replacement:''}</div>`
        ).join('');
      }
    }
    res.innerHTML = html;
  };
}

document.getElementById('modeSubtitle').textContent = READ_ONLY
  ? "View only — ask your dispatcher for changes"
  : "Click any shift to update the schedule";

document.getElementById('saveNowBtn').onclick = async () => {
  const badge = document.getElementById('saveBadge');
  const btn = document.getElementById('saveNowBtn');
  btn.disabled = true; btn.textContent = "Saving…";
  await saveData();
  try{
    const check = await window.storage.get(STORAGE_KEY, true);
    if(check && check.value){
      badge.style.color = "#2F6E62";
      badge.textContent = "✓ Saved and verified in Firebase";
    } else {
      badge.style.color = "#A63A2E";
      badge.textContent = "✗ Save did not verify — check Firebase connection";
    }
  }catch(e){
    badge.style.color = "#A63A2E";
    badge.textContent = "✗ Could not verify save — check Firebase connection";
  }
  btn.disabled = false; btn.textContent = "Save Now";
  setTimeout(()=>{ if(badge){ badge.textContent=""; badge.style.color=""; } }, 8000);
};

loadData();
</script>

<script>
  // ---- Access gate: reuses the same dispatch password already stored by the BTS Driver Log app.
  // Coming in via a dispatch-generated link (with ?auth=<password>) skips the prompt automatically;
  // anyone who just has the bare URL still has to enter the password.
  async function getStoredDispatchPassword(){
    try{
      const snap = await db.ref('data/bts-dispatch-password').once('value');
      const raw = snap.val();
      if(!raw) return null;
      const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
      return parsed.password || null;
    }catch(e){ return null; }
  }
  function showApp(){
    document.getElementById('msGate').style.display = 'none';
    document.getElementById('appRoot').style.display = '';
  }
  (async function initGate(){
    const stored = await getStoredDispatchPassword();
    const urlAuth = new URLSearchParams(window.location.search).get('auth');
    if(stored && urlAuth === stored){ showApp(); return; }
    if(sessionStorage.getItem('bts-schedule-authed') === '1'){ showApp(); return; }

    const errEl = document.getElementById('msGateErr');
    if(!stored){
      errEl.style.color = '#8a7d76';
      errEl.textContent = 'No dispatch password has been set yet — log into Dispatch in the BTS Driver Log app first, then come back here.';
      document.getElementById('msGateBtn').disabled = true;
      return;
    }
    document.getElementById('msGateBtn').onclick = () => {
      const entered = document.getElementById('msGatePw').value;
      if(entered === stored){
        sessionStorage.setItem('bts-schedule-authed', '1');
        showApp();
      } else {
        errEl.style.color = '#A63A2E';
        errEl.textContent = 'Incorrect password.';
      }
    };
    document.getElementById('msGatePw').addEventListener('keydown', e=>{
      if(e.key === 'Enter') document.getElementById('msGateBtn').click();
    });
  })();
</script>
